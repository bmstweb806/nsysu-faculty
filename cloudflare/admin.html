<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>教師資料管理</title><style>
:root{--blue:#17618c;--ink:#263847;--muted:#647786;--line:#d8e2e9;--soft:#f4f8fa}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.5 Arial,"Noto Sans TC",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;background:#fff;border:1px solid #b8cddc;border-radius:0;padding:8px 12px;color:var(--blue)}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button:disabled{opacity:.5}
input,textarea,select{width:100%;padding:8px;border:1px solid #b5c6d3;border-radius:0;background:white;color:var(--ink)}
textarea{min-height:90px;resize:vertical}label{display:block;font-size:12px;font-weight:bold;color:#435c70;margin:8px 0}
header{background:#123e5b;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px}header h1{font-size:18px;margin:0 auto 0 0}
header button{background:transparent;color:white;border-color:#90afc3}
#status{padding:8px 18px;min-height:36px;border-bottom:1px solid var(--line);color:#175b80}#status.error{color:#a72134;background:#fff3f3}
#login{max-width:400px;margin:9vh auto;padding:28px;border:1px solid var(--line);box-shadow:0 12px 35px #123e5b12}
#login h2{margin-top:0}.hint{font-size:12px;color:var(--muted)}
#app{display:none}#layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 92px)}
aside{background:var(--soft);border-right:1px solid var(--line);padding:13px}aside button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px;color:#2d4a60}
aside button.selected{background:var(--blue);color:white}main{padding:18px;max-height:calc(100vh - 92px);overflow:auto}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar h2{margin:0 auto 0 0;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}.wide{grid-column:1/-1}
.section{border-bottom:1px solid var(--line);padding:10px 0 22px;margin-bottom:16px}.section h3{color:#23485f}
.entry{border:1px solid var(--line);padding:14px;margin:12px 0;background:#fff}.handle{cursor:grab;color:#506b7e;font-size:19px;letter-spacing:3px}
.teacher-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);margin-bottom:6px}.teacher-row .handle{padding:3px 8px}
.teacher-row button:first-of-type{flex:1;text-align:left}.badge{font-size:11px;color:#517080;border:1px solid var(--line);padding:2px 5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.muted{color:var(--muted)}details{margin:12px 0}
@media(max-width:720px){#layout{display:block}aside{display:flex;overflow:auto}aside button{white-space:nowrap}main{max-height:none}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body>
<div id="login"><h2>教師資料管理</h2><p class="hint">Faculty Management · 密碼登入</p>
<form id="login-form"><label>帳號<input id="username" type="email" autocomplete="username" required></label>
<label>密碼<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">登入系統</button></form>
<details id="setup-box"><summary>首次建立管理員</summary><p class="hint">請輸入部署時提供的初始化憑證，自行設定密碼。</p>
<form id="setup-form"><label>初始化憑證<input id="setup-token" type="password" required></label>
<label>管理員電子郵件<input id="setup-user" type="email" required></label>
<label>新密碼（至少 14 字元）<input id="setup-password" type="password" minlength="14" required></label>
<button>建立管理員</button></form></details><p id="login-error" role="alert"></p></div>
<div id="app"><header><h1>教師資料管理</h1><span id="account"></span><button id="logout">登出</button></header>
<div id="status" role="status">就緒</div><div id="layout"><aside id="nav"></aside><main id="main"></main></div></div>
<script>
let csrfToken=sessionStorage.getItem('faculty_csrf')||'',boot=null,current=null,dirty=false,dragId=null;
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(s,error=false){$('status').textContent=s;$('status').classList.toggle('error',error)}
async function api(path,method='GET',data,extra={}){const r=await fetch(path,{method,credentials:'same-origin',headers:{...(data?{'content-type':'application/json'}:{}),...(method!=='GET'&&csrfToken?{'x-csrf-token':csrfToken}:{}),...extra},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'請求失敗');return j}
async function refresh(){boot=await api('/api/bootstrap');$('login').style.display='none';$('app').style.display='block';$('account').textContent=boot.username;renderNav();showList()}
function renderNav(){const admin=boot.role==='ADMIN';$('nav').innerHTML='<button id="nav-list">教師列表</button>'+(admin?'<button id="nav-config">分類與欄位設定</button><button id="nav-users">帳號管理</button><button id="nav-embed">Rpage 嵌入碼</button>':'');
 $('nav-list').onclick=showList;if(admin){$('nav-config').onclick=()=>showConfig();$('nav-users').onclick=showUsers;$('nav-embed').onclick=showEmbed}}
function askLeave(){return !dirty||confirm('有未儲存的修改，確定離開？')}
function showList(){if(!askLeave())return;dirty=false;current=null;let html='<div class="toolbar"><h2>教師列表</h2>'+(boot.role==='ADMIN'?'<button id="add-teacher">新增教師</button>':'')+'</div><p class="hint">拖曳六點圖示調整排序；草稿不會顯示於公開網站。</p><div id="teacher-rows">';
 for(const t of boot.teachers)html+='<div class="teacher-row" data-id="'+esc(t.id)+'" draggable="'+(boot.role==='ADMIN')+'"><span class="handle">⠿</span><button data-open="'+esc(t.id)+'">'+esc(t.name||t.id)+'</button><span class="badge">'+esc(t.status)+'</span></div>';
 $('main').innerHTML=html+'</div>';document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>openTeacher(x.dataset.open));
 if(boot.role==='ADMIN'){$('add-teacher').onclick=async()=>{const id=prompt('新教師 ID（英數、底線或連字號）');if(!id)return;try{await api('/api/teachers','POST',{id});await refresh();await openTeacher(id)}catch(e){status(e.message,true)}};
 document.querySelectorAll('.teacher-row').forEach(x=>{x.ondragstart=()=>dragId=x.dataset.id;x.ondragover=e=>e.preventDefault();x.ondrop=async e=>{e.preventDefault();if(!dragId||dragId===x.dataset.id)return;const ids=boot.teachers.map(t=>t.id),a=ids.indexOf(dragId),b=ids.indexOf(x.dataset.id);ids.splice(b,0,ids.splice(a,1)[0]);try{await api('/api/reorder','POST',{ids});boot=await api('/api/bootstrap');showList();status('排序已儲存')}catch(err){status(err.message,true)}}})}}
async function openTeacher(id){if(!askLeave())return;try{current=await api('/api/teachers/'+encodeURIComponent(id));dirty=false;renderTeacher()}catch(e){status(e.message,true)}}
function field(label,key,value,type='text',wide=false){return '<label class="'+(wide?'wide':'')+'">'+esc(label)+(type==='textarea'?'<textarea data-key="'+key+'">'+esc(value)+'</textarea>':'<input data-key="'+key+'" type="'+type+'" value="'+esc(value)+'">')+'</label>'}
function renderTeacher(){const t=current.teacher,admin=boot.role==='ADMIN';let html='<div class="toolbar"><h2>'+esc(t.name_zh||t.teacher_id)+'</h2><span class="badge">'+esc(t.publish_status)+'</span></div><div class="actions"><button id="back">返回</button><button class="primary" id="save">儲存草稿</button><button id="publish">發布教師資料</button><button id="history">歷史版本</button>'+(admin?'<button id="archive">封存教師</button>':'')+'</div><div class="section"><h3>基本資料</h3><div class="grid">';
 for(const [key,label] of [['name','姓名'],['title','職稱'],['unit','系所'],['office','研究室'],['expertise','研究專長']])for(const [loc,language] of [['zh','中文'],['en','英文']])html+=field(label+'（'+language+'）',key+'_'+loc,t[key+'_'+loc],key==='expertise'?'textarea':'text',key==='expertise');
 for(const [key,label] of [['email','電子郵件'],['profile_url','官方頁面'],['photo_url','照片網址']])html+=field(label,key,t[key],key==='email'?'email':'url');
 html+='<label>教師分類<select data-key="category_key" '+(admin?'':'disabled')+'>'+boot.categories.map(c=>'<option value="'+esc(c.key)+'" '+(t.category_key===c.key?'selected':'')+'>'+esc(c.zh)+'</option>').join('')+'</select></label>';
 for(const loc of ['zh','en'])html+='<label><input type="checkbox" data-key="visible_'+loc+'" '+(t['visible_'+loc]?'checked':'')+'> '+(loc==='zh'?'公開中文':'公開英文')+'</label>';
 html+='</div></div>';
 for(const tab of boot.tabs.filter(x=>x.is_active)){const entries=current.entries.filter(e=>e.section_key===tab.key);html+='<div class="section"><h3>'+esc(tab.zh)+' <button data-add="'+esc(tab.key)+'">新增內容</button></h3><div data-section="'+esc(tab.key)+'">';
 entries.forEach(e=>{const i=current.entries.indexOf(e);html+='<div class="entry" draggable="true" data-entry="'+i+'"><div class="toolbar"><span class="handle">⠿</span><strong>內容 '+(i+1)+'</strong><button data-remove="'+i+'">移除</button></div><div class="grid">';
 for(const [key,label] of [['title_zh','標題（中文）'],['title_en','標題（英文）'],['content_zh','內容（中文）'],['content_en','內容（英文）'],['link_url','連結網址']])html+=field(label,'entry:'+i+':'+key,e[key],key.startsWith('content')?'textarea':'text',key.startsWith('content'));
 for(const loc of ['zh','en'])html+='<label><input type="checkbox" data-key="entry:'+i+':visible_'+loc+'" '+(e['visible_'+loc]?'checked':'')+'> '+(loc==='zh'?'公開中文':'公開英文')+'</label>';
 for(const f of boot.fields.filter(x=>x.section_key===tab.key&&x.is_active))for(const loc of ['zh','en'])html+=field(f.zh+'（'+(loc==='zh'?'中文':'英文')+'）','field:'+i+':'+f.key+':'+loc,e.fields?.[f.key]?.[loc]||'',f.type==='textarea'?'textarea':'text');
 html+='</div></div>'});html+='</div></div>'}
 $('main').innerHTML=html;document.querySelectorAll('[data-key]').forEach(x=>x.oninput=()=>{const parts=x.dataset.key.split(':');const val=x.type==='checkbox'?x.checked:x.value;if(parts[0]==='entry')current.entries[Number(parts[1])][parts[2]]=val;else if(parts[0]==='field'){const e=current.entries[Number(parts[1])];((e.fields||={})[parts[2]]||={})[parts[3]]=val}else current.teacher[parts[0]]=val;dirty=true;status('未儲存')});
 document.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>{current.entries.push({section_key:x.dataset.add,entry_type:'list_item',title_zh:'',title_en:'',content_zh:'',content_en:'',link_url:'',visible_zh:true,visible_en:true,fields:{}});dirty=true;renderTeacher()});
 document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{current.entries.splice(Number(x.dataset.remove),1);dirty=true;renderTeacher()});
 document.querySelectorAll('[data-entry]').forEach(x=>{x.ondragstart=()=>dragId=Number(x.dataset.entry);x.ondragover=e=>e.preventDefault();x.ondrop=e=>{e.preventDefault();const a=dragId,b=Number(x.dataset.entry);if(current.entries[a]?.section_key!==current.entries[b]?.section_key)return;current.entries.splice(b,0,current.entries.splice(a,1)[0]);dirty=true;renderTeacher()}});
 $('back').onclick=showList;$('save').onclick=save;$('publish').onclick=async()=>{try{if(dirty)await save();await api('/api/teachers/'+t.teacher_id+'/publish','POST',{});boot=await api('/api/bootstrap');current=await api('/api/teachers/'+t.teacher_id);dirty=false;renderTeacher();status('已發布')}catch(e){status(e.message,true)}};
 $('history').onclick=async()=>{try{const h=await api('/api/teachers/'+t.teacher_id+'/revisions');const id=prompt('可回復版本：\n'+h.map(x=>x.revision_id+' · '+x.created_at).join('\n')+'\n\n輸入要回復的版本 ID');if(!id)return;await api('/api/teachers/'+t.teacher_id+'/revisions/'+encodeURIComponent(id)+'/restore','POST',{});current=await api('/api/teachers/'+t.teacher_id);renderTeacher();status('版本已回復為草稿')}catch(e){status(e.message,true)}};
 if(admin)$('archive').onclick=async()=>{if(prompt('輸入教師 ID 確認封存')!==t.teacher_id)return;try{await api('/api/teachers/'+t.teacher_id+'/archive','POST',{});boot=await api('/api/bootstrap');dirty=false;showList();status('教師已封存')}catch(e){status(e.message,true)}}}
async function save(){try{current=await api('/api/teachers/'+current.teacher.teacher_id,'PUT',current);dirty=false;renderTeacher();status('草稿已儲存')}catch(e){status(e.message,true);throw e}}
async function showConfig(existing){if(!existing&&!askLeave())return;try{const cfg=existing||await api('/api/config');let html='<div class="toolbar"><h2>分類與欄位設定</h2><button id="cfg-save">儲存設定</button><button class="primary" id="cfg-publish">發布設定</button><button id="cfg-history">歷史版本</button></div><p class="hint">設定儲存後仍是草稿；發布後公開頁面才更新。可編輯標籤、啟用狀態與新增欄位。</p>';
 for(const [title,arr] of [['教師分類',cfg.categories],['頁籤',cfg.tabs],['欄位',cfg.fields]]){html+='<div class="section"><h3>'+title+'</h3>';arr.forEach((x,i)=>{html+='<div class="entry grid"><strong class="wide">'+esc(x.section_key?x.section_key+'/'+x.key:x.key)+'</strong>'+field('中文','cfg:'+title+':'+i+':zh',x.zh)+field('英文','cfg:'+title+':'+i+':en',x.en)+'<label><input type="checkbox" data-key="cfg:'+title+':'+i+':is_active" '+(x.is_active?'checked':'')+'> 啟用</label>'+(x.hasOwnProperty('show_public')?'<label><input type="checkbox" data-key="cfg:'+title+':'+i+':show_public" '+(x.show_public?'checked':'')+'> 公開欄位</label>':'')+'</div>'});html+='</div>'}
 html+='<button id="add-category">新增教師分類</button> <button id="add-tab">新增頁籤</button> <button id="add-field">新增欄位</button>';$('main').innerHTML=html;
 document.querySelectorAll('[data-key^="cfg:"]').forEach(x=>x.oninput=()=>{const [,kind,i,key]=x.dataset.key.split(':');const arr=kind==='教師分類'?cfg.categories:kind==='頁籤'?cfg.tabs:cfg.fields;arr[Number(i)][key]=x.type==='checkbox'?x.checked:x.value;dirty=true;status('設定未儲存')});
 $('cfg-save').onclick=async()=>{try{await api('/api/config','PUT',cfg);dirty=false;status('設定草稿已儲存')}catch(e){status(e.message,true)}};
 $('cfg-publish').onclick=async()=>{try{if(dirty)await api('/api/config','PUT',cfg);await api('/api/config/publish','POST',{});dirty=false;boot=await api('/api/bootstrap');status('設定已發布')}catch(e){status(e.message,true)}};
 $('cfg-history').onclick=async()=>{try{const h=await api('/api/config/revisions');const id=prompt('可回復版本：\n'+h.map(x=>x.revision_id+' · '+x.created_at).join('\n')+'\n\n輸入版本 ID');if(!id)return;await api('/api/config/revisions/'+encodeURIComponent(id)+'/restore','POST',{});dirty=false;showConfig();status('設定已回復為草稿')}catch(e){status(e.message,true)}};
 $('add-category').onclick=()=>{const key=prompt('分類 key（英數與底線）');if(!key)return;cfg.categories.push({key,zh:key,en:key,is_active:true});dirty=true;showConfig(cfg)};
 $('add-tab').onclick=()=>{const key=prompt('頁籤 key（英數與底線）');if(!key)return;cfg.tabs.push({key,zh:key,en:key,is_active:true,entry_layout:'list'});dirty=true;showConfig(cfg)};
 $('add-field').onclick=()=>{const section_key=prompt('所屬頁籤 key');if(!section_key)return;const key=prompt('欄位 key');if(!key)return;cfg.fields.push({section_key,key,zh:key,en:key,type:'text',is_active:true,show_public:true,required:false});dirty=true;showConfig(cfg)};
 }catch(e){status(e.message,true)}}
async function showUsers(){if(!askLeave())return;try{const [users,grants]=await Promise.all([api('/api/users'),api('/api/pending-grants')]);$('main').innerHTML='<div class="toolbar"><h2>帳號管理</h2></div><div id="user-list">'+users.map(x=>'<div class="teacher-row">'+esc(x.username)+' · '+esc(x.roles||'')+' · '+esc(x.teachers||'')+' <button data-reset="'+esc(x.user_id)+'">重設密碼</button><button data-toggle="'+esc(x.user_id)+'" data-active="'+!!x.is_active+'">'+(x.is_active?'停用':'啟用')+'</button></div>').join('')+'</div><div class="section"><h3>待設定密碼的授權</h3>'+grants.filter(x=>!x.has_account).map(x=>'<div class="teacher-row">'+esc(x.email)+' · '+esc(x.role)+' · '+esc(x.teacher_id||'')+'</div>').join('')+'</div><div class="section"><h3>新增帳號</h3><form id="user-form" class="grid"><label>電子郵件<input id="user-email" type="email" required></label><label>角色<select id="user-role"><option>TEACHER</option><option>ADMIN</option></select></label><label>教師 ID<input id="user-teacher"></label><label>新密碼（至少 14 字元）<input id="user-password" type="password" minlength="14" required></label><button class="primary">建立</button></form></div>';
 document.querySelectorAll('[data-reset]').forEach(x=>x.onclick=async()=>{const password=prompt('輸入新的臨時密碼（至少 14 字元）');if(!password)return;try{await api('/api/users/'+x.dataset.reset+'/password','POST',{password});status('密碼已更新，舊登入已撤銷')}catch(e){status(e.message,true)}});
 document.querySelectorAll('[data-toggle]').forEach(x=>x.onclick=async()=>{try{await api('/api/users/'+x.dataset.toggle,'PATCH',{is_active:x.dataset.active!=='true'});showUsers();status('帳號狀態已更新')}catch(e){status(e.message,true)}});
 $('user-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/users','POST',{username:$('user-email').value,role:$('user-role').value,teacher_id:$('user-teacher').value,password:$('user-password').value});showUsers();status('帳號已建立')}catch(err){status(err.message,true)}}}catch(e){status(e.message,true)}}
function showEmbed(){if(!askLeave())return;const base=location.origin;let html='<h2>Rpage 嵌入碼</h2><p class="hint">將下列程式碼貼至對應 Rpage 頁面的 HTML 區塊。</p>';
 for(const category of boot.categories)for(const loc of ['zh','en']){const snippet='<div data-nsysu-faculty data-category="'+category.key+'" data-lang="'+loc+'"></div><script src="'+base+'/embed.js" defer><\/script>';html+='<label>'+esc(category.zh)+' · '+loc+'<textarea readonly>'+esc(snippet)+'</textarea></label>'}
 html+='<label>教師個人頁面<textarea readonly>'+esc('<div data-nsysu-faculty-profile data-teacher="TEACHER_ID" data-lang="zh"></div><script src="'+base+'/embed.js" defer><\/script>')+'</textarea></label>';$('main').innerHTML=html}
$('login-form').onsubmit=async e=>{e.preventDefault();try{const oldPassword=$('password').value;const r=await api('/api/login','POST',{username:$('username').value,password:oldPassword});csrfToken=r.csrf;sessionStorage.setItem('faculty_csrf',csrfToken);$('password').value='';
 if(r.must_change_password){const password=prompt('首次登入請設定新的密碼（至少 14 字元）');if(!password)return;await api('/api/password','POST',{current_password:oldPassword,new_password:password});sessionStorage.removeItem('faculty_csrf');csrfToken='';$('login-error').textContent='密碼已更新，請重新登入';return}
 await refresh()}catch(err){$('login-error').textContent=err.message}};
$('setup-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/setup','POST',{username:$('setup-user').value,password:$('setup-password').value},{'x-setup-token':$('setup-token').value});$('setup-password').value='';$('setup-token').value='';$('login-error').textContent='管理員已建立，請登入'}catch(err){$('login-error').textContent=err.message}};
$('logout').onclick=async()=>{try{await api('/api/logout','POST',{})}finally{csrfToken='';sessionStorage.removeItem('faculty_csrf');location.reload()}};
if(csrfToken)refresh().catch(()=>{sessionStorage.removeItem('faculty_csrf');csrfToken=''});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
</script></body></html>
