<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>教師資料管理</title><style>
:root{--blue:#17618c;--ink:#263847;--muted:#647786;--line:#d8e2e9;--soft:#f4f8fa}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f2f5f7;font:15px/1.6 Arial,"Noto Sans TC",sans-serif}a{color:var(--blue)}[hidden]{display:none!important}
button,input,textarea,select{font:inherit}button,.button-link{cursor:pointer;background:#fff;border:1px solid #bccedb;border-radius:3px;padding:9px 16px;color:var(--blue);text-decoration:none;display:inline-block;line-height:1.5}button:hover,.button-link:hover{background:#eaf2f7}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button:disabled{opacity:.5;cursor:wait}button.danger{color:#a13b44;border-color:#e2c5c8}
input,textarea,select{display:block;width:100%;padding:10px 12px;margin-top:7px;border:1px solid #bacbd6;border-radius:3px;background:#fff;color:var(--ink)}input:focus,textarea:focus,select:focus{outline:2px solid #79b7d6;outline-offset:1px}input[type=checkbox]{display:inline-block;width:17px;height:17px;margin:0 7px 0 0;vertical-align:middle}textarea{min-height:115px;resize:vertical}label{display:block;font-size:13px;font-weight:600;color:#435c70;margin:8px 0}
header{background:#123e5b;color:#fff;padding:18px 28px;display:flex;align-items:center;gap:18px}header h1{font-size:19px;margin:0 auto 0 0;letter-spacing:.04em}header button,header a{background:transparent;color:#fff;border-color:#6f95af}header small{display:block;font-size:10px;letter-spacing:.16em;color:#bad2e2}#account{font-size:12px;color:#dce9f1}
#status{padding:9px 28px;min-height:40px;background:#fff;border-bottom:1px solid var(--line);color:#175b80;font-size:13px}#status.error{color:#a72134;background:#fff3f3}
#login{max-width:440px;margin:9vh auto;padding:36px;background:#fff;border-top:4px solid #17618c;box-shadow:0 12px 35px #123e5b12}#login h2{font-size:26px;margin:0 0 6px}#login-form{margin-top:24px}#login-form button{width:100%;margin:20px 0 14px}#login-error:empty{display:none}#login-error{background:#fff3f3;color:#943340;padding:12px}#setup-box{border-top:1px solid var(--line);padding-top:18px}.hint{font-size:13px;color:var(--muted);font-weight:normal;margin:6px 0 18px}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.lead{font-size:14px;color:var(--muted);margin:8px 0 24px}
#app{display:none}#layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 120px)}aside{background:#fff;border-right:1px solid var(--line);padding:28px 14px}aside small{display:block;padding:0 14px 12px;color:var(--muted);font-size:11px;letter-spacing:.12em}aside button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;margin:3px 0;color:#426278}aside button.selected{background:#e7f1f7;color:#12577e;font-weight:bold;border-left:3px solid #17618c;border-radius:0}aside a{display:block;padding:12px 14px;margin-top:24px;font-size:13px;border-top:1px solid var(--line);text-decoration:none}
main{padding:32px 40px 70px;min-width:0;max-width:1500px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.toolbar h2{margin:0 auto 0 0;font-size:27px;letter-spacing:.02em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}.wide{grid-column:1/-1}.section{background:white;border:1px solid var(--line);padding:24px;margin:0 0 22px}.section h3{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#23485f;font-size:18px;margin:0 0 16px}.entry{border:1px solid var(--line);padding:22px;margin:14px 0;background:#fff}.handle{cursor:grab;color:#6b879a;font-size:22px;letter-spacing:3px}.teacher-row{display:flex;align-items:center;gap:16px;padding:17px 22px;background:#fff;border-bottom:1px solid var(--line)}.teacher-row:last-child{border-bottom:0}.teacher-row .handle{padding:3px 4px}.teacher-row button:first-of-type{flex:1;text-align:left;background:none;border:0;font-size:17px;font-weight:600}.teacher-row small{display:block;font-size:12px;font-weight:normal;color:var(--muted)}#teacher-rows{border:1px solid var(--line)}.badge{display:inline-block;white-space:nowrap;font-size:12px;color:#517080;background:#eef4f7;padding:3px 9px;border-radius:2px}.badge.live{background:#e6f2ec;color:#28704b}.badge.draft{background:#fff2da;color:#90630e}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px;padding:14px 0;position:sticky;top:0;z-index:5;background:#f2f5f7;border-bottom:1px solid var(--line)}.actions .spacer{flex:1}.muted{color:var(--muted)}details{margin:12px 0}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 28px}.flow div{background:#f8fbfd;padding:16px 22px}.flow b{font-size:13px;color:var(--blue);display:block}.flow span{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 22px;padding-bottom:10px}.tabs button{white-space:nowrap;border-color:transparent;background:transparent}.tabs button.selected{background:#17618c;color:#fff}.empty{padding:24px;border:1px dashed #b8cddc;color:var(--muted);text-align:center}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);margin-bottom:26px}table{border-collapse:collapse;width:100%;text-align:left;font-size:14px}th{background:#f7fafc;color:#647786;font-size:12px;font-weight:600;padding:13px 20px;border-bottom:1px solid var(--line)}td{padding:17px 20px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td small{display:block;color:var(--muted);font-size:12px}td .actions-inline{display:flex;gap:8px;justify-content:flex-end}.info{background:#eaf3f9;border-left:3px solid #17618c;padding:16px 20px;margin:0 0 24px;font-size:14px}.info b{display:block;margin-bottom:4px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:28px 0 12px}.section-head h3{margin:0;font-size:18px}dialog{border:0;border-top:4px solid #17618c;padding:30px;width:min(500px,calc(100% - 32px));color:var(--ink);box-shadow:0 18px 70px #123e5b30}dialog::backdrop{background:#122e4266}dialog h2{margin:0 0 8px;font-size:23px}dialog .dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.form-error{color:#a72134}.danger-area{margin-top:36px;border-top:1px solid var(--line);padding-top:20px;text-align:right}
@media(max-width:900px){main{padding:24px}#account{display:none}.teacher-row{padding:14px}.flow div{padding:14px}}@media(max-width:650px){header{padding:16px;gap:8px}header h1{font-size:16px}header small{display:none}header .button-link{font-size:12px;padding:8px}#layout{display:block}aside{display:flex;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}aside small,aside a{display:none}aside button{white-space:nowrap;width:auto;margin:0;padding:9px 12px}aside button.selected{border-left:0;border-bottom:2px solid #17618c}main{padding:22px 16px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.section{padding:18px}.toolbar h2{font-size:24px}.flow span{display:none}.flow div{padding:10px}.flow b{font-size:12px}.teacher-row{gap:6px}.teacher-row button:first-of-type{font-size:15px}.actions{gap:6px}.actions button{padding:8px 10px}#login{margin:5vh 16px}.tabs{margin-bottom:16px}}

.language-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-bottom:24px;align-items:start}.language-card{min-width:0;background:#fff;border:1px solid #cddde7;border-radius:6px;overflow:hidden}.language-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;background:#edf5fa;border-bottom:1px solid #d7e5ee}.language-heading h4{display:flex;align-items:center;gap:10px;margin:0;font-size:17px;color:#23485f}.language-icon{display:grid;place-items:center;background:white;border:1px solid #d2e1eb;border-radius:4px;width:31px;height:31px;font-size:13px;color:#17618c}.language-body{padding:8px 20px 22px}.language-body>label{margin:14px 0 0}.language-body textarea{min-height:150px}.visibility-control{position:relative;display:inline-flex;align-items:center;gap:9px;flex-shrink:0;cursor:pointer;margin:0;font-size:13px;font-weight:600;color:#17618c;padding:7px 9px;border-radius:5px}.visibility-control input[type=checkbox]{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}.switch-track{display:block;width:36px;height:21px;border-radius:20px;background:#8899a5;padding:3px;transition:background .15s}.switch-track:before{content:"";display:block;width:15px;height:15px;background:white;border-radius:50%;box-shadow:0 1px 3px #0002;transition:transform .15s}.visibility-control input:checked+.switch-track{background:#17618c}.visibility-control input:checked+.switch-track:before{transform:translateX(15px)}.visibility-control:focus-within{outline:3px solid #8cc3df;outline-offset:2px}.visibility-state{min-width:39px}.language-card[data-visible=false] .language-heading{background:#f4f6f8}.language-card[data-visible=false] .visibility-state{color:#6b7b87}.shared-fields{border-radius:6px}.shared-fields h3{font-size:17px}.entry-section{padding:22px}.entry-section>.entry{padding:0;border-radius:6px;overflow:hidden;margin:20px 0}.entry-heading{margin:0;padding:12px 18px;background:#f6f9fb;border-bottom:1px solid var(--line)}.entry-heading strong{flex:1;font-size:14px}.entry-heading button{padding:5px 12px;font-size:12px}.entry .language-grid{padding:18px 18px 0;margin:0;gap:18px}.entry .language-heading{padding:13px 16px}.entry .language-body{padding:5px 16px 18px}.entry-link{padding:2px 18px 18px}.extra-fields{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:13px}.extra-fields summary{cursor:pointer;color:#17618c}.actions button{white-space:nowrap}@media(max-width:1100px){.language-grid{gap:16px}.language-heading{padding:14px}.language-body{padding:6px 14px 18px}}@media(max-width:850px){.language-grid{grid-template-columns:1fr}.entry .language-grid{padding:14px 14px 0}.entry-link{padding:0 14px 14px}.entry-section{padding:16px}.actions{position:static}.actions .spacer{display:none}}

input,textarea,select{font-weight:400}.editor-more{position:relative;margin:0}.editor-more summary{list-style:none;cursor:pointer;border:1px solid #bccedb;border-radius:3px;padding:9px 16px;color:var(--blue);background:#fff;white-space:nowrap}.editor-more summary::-webkit-details-marker{display:none}.editor-more[open] summary{background:#eaf2f7}.editor-more>div{position:absolute;top:calc(100% + 7px);right:0;z-index:20;min-width:180px;display:grid;gap:4px;padding:8px;background:white;border:1px solid var(--line);border-radius:5px;box-shadow:0 10px 24px #123e5b22}.editor-more>div button,.editor-more>div a{text-align:left;width:100%;border:0;padding:9px 12px;font-size:13px}.editor-more summary:focus-visible{outline:3px solid #79b7d6;outline-offset:2px}
</style></head><body>
<div id="login"><div class="eyebrow">NSYSU · Faculty Management</div><h2>教師資料管理</h2><p class="hint">管理教師資料，讓每一次更新清楚到位。</p>
<form id="login-form"><label>帳號<input id="username" type="email" autocomplete="username" required></label>
<label>密碼<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">登入系統</button></form><a href="/guide" target="_blank" rel="noopener">第一次使用？閱讀一頁操作說明 ↗</a>
<details id="setup-box" hidden><summary>首次建立管理員</summary><p class="hint">請輸入部署時提供的初始化憑證，自行設定密碼。</p>
<form id="setup-form"><label>初始化憑證<input id="setup-token" type="password" required></label>
<label>管理員電子郵件<input id="setup-user" type="email" required></label>
<label>新密碼（至少 8 字元）<input id="setup-password" type="password" minlength="8" required></label>
<button>建立管理員</button></form></details><p id="login-error" role="alert"></p></div>
<div id="app"><header><h1><small>NSYSU · FACULTY</small>教師資料管理</h1><span id="account"></span><a class="button-link" href="/guide" target="_blank" rel="noopener">操作說明 ↗</a><button id="logout">登出</button></header>
<div id="status" role="status">就緒</div><div id="publication-notice" class="info" hidden style="margin:0"></div><div id="layout"><aside id="nav"></aside><main id="main"></main></div></div>
<script>
let csrfToken=sessionStorage.getItem('faculty_csrf')||'',boot=null,current=null,dirty=false,dragId=null,activeSection='basic';
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(s,error=false){$('status').textContent=s;$('status').classList.toggle('error',error)}
async function api(path,method='GET',data,extra={}){const r=await fetch(path,{method,credentials:'same-origin',headers:{...(data?{'content-type':'application/json'}:{}),...(method!=='GET'&&csrfToken?{'x-csrf-token':csrfToken}:{}),...extra},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'請求失敗');if(j.publication_pending){status('資料已儲存，網站發布中…');for(let i=0;i<30;i++){await new Promise(resolve=>setTimeout(resolve,1000));const state=await api('/api/publication');if(state.state==='idle')return j;if(state.state==='failed')throw Error('網站發布未完成，上一版保留；請重新同步網站。')}throw Error('網站仍在發布中，請稍後查看發布狀態。')}return j}
async function refresh(){boot=await api('/api/bootstrap');$('login').style.display='none';$('app').style.display='block';$('account').textContent=boot.username;renderNav();showList();checkPublication()}
async function checkPublication(){try{const state=await api('/api/publication');const notice=$('publication-notice');notice.hidden=!(state.mode==='static'&&(state.state!=='idle'||state.generation!==state.published_generation));if(!notice.hidden){notice.textContent=state.state==='publishing'?'網站發布中，完成後公開頁面會自動更新。':'資料已儲存，公開網站尚未同步。';if(boot.role==='ADMIN'&&state.state!=='publishing'){const button=document.createElement('button');button.textContent='重新同步網站';button.onclick=async()=>{button.disabled=true;try{await api('/api/publication/retry','POST',{});await checkPublication();status('公開網站已同步')}catch(e){status(e.message,true);button.disabled=false}};notice.append(' ',button)}}}catch{}}
function navActive(id){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('selected',b.id===id))}
function renderNav(){const admin=boot.role==='ADMIN';$('nav').innerHTML='<small>工作空間</small><button id="nav-list">教師資料</button>'+(admin?'<button id="nav-users">帳號與密碼</button><button id="nav-config">網站設定</button><button id="nav-embed">Rpage 嵌入碼</button>':'')+'<a href="/" target="_blank" rel="noopener">公開教師總覽 ↗</a><a href="/guide" target="_blank" rel="noopener">一頁操作說明 ↗</a>';
 $('nav-list').onclick=showList;if(admin){$('nav-config').onclick=()=>{navActive('nav-config');showConfig()};$('nav-users').onclick=showUsers;$('nav-embed').onclick=()=>{navActive('nav-embed');showEmbed()}}}
function badge(status){return '<span class="badge '+(status==='PUBLISHED'?'live':'draft')+'">'+(status==='PUBLISHED'?'已發布':'尚未發布')+'</span>'}
function askLeave(){return !dirty||confirm('有未儲存的修改，確定離開？')}
function showList(){if(!askLeave())return;dirty=false;current=null;navActive('nav-list');let html='<div class="toolbar"><h2>教師資料</h2>'+(boot.role==='ADMIN'?'<button class="primary" id="add-teacher">＋ 新增教師</button>':'')+'</div><p class="lead">選擇一位老師開始編輯。拖曳六點圖示可調整公開列表順序。</p><div class="flow"><div><b>01　選擇教師</b><span>維護基本資料與學術內容</span></div><div><b>02　儲存草稿</b><span>保存修改，公開頁面暫不更新</span></div><div><b>03　發布更新</b><span>確認後同步至公開網站</span></div></div><div id="teacher-rows">';
 for(const t of boot.teachers)html+='<div class="teacher-row" data-id="'+esc(t.id)+'" draggable="'+(boot.role==='ADMIN')+'"><span class="handle">⠿</span><button data-open="'+esc(t.id)+'">'+esc(t.name||t.id)+'<small>'+esc(boot.categories.find(c=>c.key===t.category_key)?.zh||'')+' · '+esc(t.id)+'</small></button>'+badge(t.status)+'<span class="muted">編輯 →</span></div>';
 $('main').innerHTML=html+'</div>';document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>openTeacher(x.dataset.open));
 if(boot.role==='ADMIN'){$('add-teacher').onclick=async()=>{const id=prompt('新教師 ID（英數、底線或連字號）');if(!id)return;try{await api('/api/teachers','POST',{id});await refresh();await openTeacher(id)}catch(e){status(e.message,true)}};
 document.querySelectorAll('.teacher-row').forEach(x=>{x.ondragstart=()=>dragId=x.dataset.id;x.ondragover=e=>e.preventDefault();x.ondrop=async e=>{e.preventDefault();if(!dragId||dragId===x.dataset.id)return;const ids=boot.teachers.map(t=>t.id),a=ids.indexOf(dragId),b=ids.indexOf(x.dataset.id);ids.splice(b,0,ids.splice(a,1)[0]);try{await api('/api/reorder','POST',{ids});boot=await api('/api/bootstrap');showList();status('排序已儲存')}catch(err){status(err.message,true)}}})}}
async function openTeacher(id){if(!askLeave())return;try{current=await api('/api/teachers/'+encodeURIComponent(id));dirty=false;activeSection='basic';renderTeacher()}catch(e){status(e.message,true)}}
function field(label,key,value,type='text',wide=false){return '<label class="'+(wide?'wide':'')+'">'+esc(label)+(type==='textarea'?'<textarea data-key="'+key+'">'+esc(value)+'</textarea>':'<input data-key="'+key+'" type="'+type+'" value="'+esc(value)+'">')+'</label>'}
function languageCard(loc,key,visible,content){
 const language=loc==='zh'?'中文':'English';
 return '<section class="language-card" data-visible="'+!!visible+'" aria-label="'+language+'資料"><div class="language-heading"><h4><span class="language-icon" aria-hidden="true">'+(loc==='zh'?'中':'EN')+'</span>'+language+'</h4><label class="visibility-control"><input type="checkbox" role="switch" aria-label="'+(loc==='zh'?'中文':'英文')+'公開" data-key="'+esc(key)+'" '+(visible?'checked':'')+'><span class="switch-track" aria-hidden="true"></span><span class="visibility-state" aria-hidden="true">'+(visible?'公開':'不公開')+'</span></label></div><div class="language-body">'+content+'</div></section>';
}
function teacherActions(t,admin){return '<div class="actions"><button id="back">← 教師列表</button><span class="spacer"></span><details class="editor-more"><summary>更多操作</summary><div>'+(admin?'<button id="teacher-rpage">Rpage HTML</button>':'')+'<button id="history">歷史版本</button>'+(t.publish_status==='PUBLISHED'?'<a class="button-link" href="/faculty?teacher='+encodeURIComponent(t.teacher_id)+'&lang='+(t.visible_zh?'zh':'en')+'" target="_blank" rel="noopener">查看公開頁面 ↗</a>':'')+'</div></details><button id="preview">儲存並預覽 ↗</button><button id="save">儲存草稿</button><button class="primary" id="publish">發布更新</button></div>'}
function renderTeacher(){const t=current.teacher,admin=boot.role==='ADMIN';let html='<div class="eyebrow">教師資料 / '+esc(t.teacher_id)+'</div><div class="toolbar"><h2>'+esc(t.name_zh||t.teacher_id)+'</h2>'+badge(t.publish_status)+'</div>'+teacherActions(t,admin)+'<div class="tabs"><button data-tab="basic">基本資料</button>'+boot.tabs.filter(x=>x.is_active).map(x=>'<button data-tab="'+esc(x.key)+'">'+esc(x.zh)+' · '+current.entries.filter(e=>e.section_key===x.key).length+'</button>').join('')+'</div><div data-panel="basic"><div class="language-grid">';
 for(const loc of ['zh','en']){
  let fields='';for(const [key,label] of [['name','姓名'],['title','職稱'],['unit','系所'],['office','研究室'],['expertise','研究專長']])fields+=field(label,key+'_'+loc,t[key+'_'+loc],key==='expertise'?'textarea':'text');
  html+=languageCard(loc,'visible_'+loc,t['visible_'+loc],fields);
 }
 html+='</div><div class="section shared-fields"><h3>聯絡與分類</h3><div class="grid"><label>教師分類<select data-key="category_key" '+(admin?'':'disabled')+'>'+boot.categories.map(c=>'<option value="'+esc(c.key)+'" '+(t.category_key===c.key?'selected':'')+'>'+esc(c.zh)+'</option>').join('')+'</select></label>';
 for(const [key,label] of [['email','電子郵件'],['profile_url','官方頁面'],['photo_url','照片網址']])html+=field(label,key,t[key],key==='email'?'email':'url');
 html+='</div></div></div>';
 for(const tab of boot.tabs.filter(x=>x.is_active)){const entries=current.entries.filter(e=>e.section_key===tab.key);html+='<div class="section entry-section" data-panel="'+esc(tab.key)+'"><h3>'+esc(tab.zh)+' <button data-add="'+esc(tab.key)+'">＋ 新增內容</button></h3><div data-section="'+esc(tab.key)+'">';
 entries.forEach((e,position)=>{const i=current.entries.indexOf(e);html+='<div class="entry" draggable="true" data-entry="'+i+'"><div class="toolbar entry-heading"><span class="handle" aria-label="拖曳排序">⠿</span><strong>內容 '+(position+1)+'</strong><button class="danger" data-remove="'+i+'">移除</button></div><div class="language-grid">';
 for(const loc of ['zh','en']){

 $('embed-person-tab').onclick=()=>{mode='person';update()};$('embed-list-tab').onclick=()=>{mode='list';update()};
 for(const id of ['embed-teacher','embed-lang','embed-category'])$(id).onchange=update;
 $('embed-copy').onclick=async()=>{try{await navigator.clipboard.writeText($('embed-code').value);$('embed-feedback').textContent='已複製，可貼到 Rpage 的 HTML 區塊。'}catch{$('embed-code').focus();$('embed-code').select();$('embed-feedback').textContent='程式碼已選取，請按 Ctrl+C 或 ⌘C 複製。'}};
 update();
}

$('login-form').onsubmit=async e=>{e.preventDefault();try{const oldPassword=$('password').value;const r=await api('/api/login','POST',{username:$('username').value,password:oldPassword});csrfToken=r.csrf;sessionStorage.setItem('faculty_csrf',csrfToken);$('password').value='';
 if(r.must_change_password){changeOwnPassword();return}
 await refresh()}catch(err){$('login-error').textContent=err.message}};
$('setup-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/setup','POST',{username:$('setup-user').value,password:$('setup-password').value},{'x-setup-token':$('setup-token').value});$('setup-password').value='';$('setup-token').value='';$('setup-box').hidden=true;$('setup-box').open=false;$('login-error').textContent='管理員已建立，請登入'}catch(err){$('login-error').textContent=err.message}};
$('logout').onclick=async()=>{try{await api('/api/logout','POST',{})}finally{csrfToken='';sessionStorage.removeItem('faculty_csrf');location.reload()}};
api('/api/setup/status').then(s=>{$('setup-box').hidden=!s.setup_required}).catch(()=>{$('setup-box').hidden=true});
if(csrfToken)refresh().catch(()=>{sessionStorage.removeItem('faculty_csrf');csrfToken=''});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
</script></body></html>
