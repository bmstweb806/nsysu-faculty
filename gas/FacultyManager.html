<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--blue:#17618c;--ink:#263847;--muted:#647786;--line:#d8e2e9;--soft:#f4f8fa}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font:14px/1.45 Arial,"Noto Sans TC",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;background:#fff;border:1px solid #b8cddc;border-radius:7px;padding:7px 11px;color:var(--blue)}
button:hover{background:#eaf3f8}button.primary{color:#fff;background:var(--blue);border-color:var(--blue)}button:disabled{opacity:.45;cursor:wait}
header{background:#123e5b;color:#fff;padding:12px 18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
header h1{font-size:18px;margin:0 auto 0 0}
header select{background:white;color:var(--ink);padding:8px;border-radius:7px;max-width:220px}
#status{padding:8px 18px;color:#175b80;border-bottom:1px solid var(--line);min-height:36px}
#status.error{color:#a72134;background:#fff3f3}
#layout{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:500px}
aside{border-right:1px solid var(--line);padding:13px;background:var(--soft)}
aside button{display:block;width:100%;text-align:left;margin:0 0 6px;border:0;background:none;padding:10px 11px;color:#2d4a60}
aside button.selected{background:var(--blue);color:#fff;font-weight:700}
main{padding:15px 18px;max-height:calc(100vh - 130px);overflow:auto;min-height:420px}
.topline{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:9px}
h2{font-size:19px;margin:0}p.hint{color:var(--muted);font-size:12px;margin:6px 0 13px}
label{font-size:12px;color:#435c70;font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
input,textarea,select{width:100%;padding:8px;border:1px solid #b5c6d3;border-radius:6px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:65px}
.profile-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.profile-form .long{grid-column:span 2}
.profile-form .wide{grid-column:1/-1}
.check{display:inline-flex;gap:6px;align-items:center;margin:4px 10px 4px 0}
.check input{width:auto}
.card-board{display:flex;align-items:flex-start;align-content:flex-start;gap:11px;flex-wrap:wrap;margin:9px 0 18px}
.entry-card{position:relative;flex:0 0 auto;width:300px;height:190px;min-width:230px;min-height:120px;max-width:100%;max-height:90vh;resize:both;overflow:auto;border:1px solid #b9cfde;border-radius:9px;background:white;box-shadow:0 2px 7px #0c3b5810}
.entry-card.dragging{opacity:.45}.entry-card.target{outline:2px dashed var(--blue);outline-offset:2px}
.card-top{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:7px;background:var(--soft);position:sticky;top:0;z-index:1}
.grab{cursor:grab;user-select:none;color:#356987;font-size:20px;line-height:1;padding:2px 5px;border-radius:5px}
.grab:active{cursor:grabbing}
.card-title{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-top button{padding:4px 7px;font-size:12px}
.card-content{padding:10px}
.summary{white-space:pre-wrap;max-height:65px;overflow:hidden;color:#687986;font-size:13px;margin:6px 0}
.card-form{display:grid;grid-template-columns:1fr;gap:9px}
.card-form .field{gap:3px}
.card-form textarea{min-height:58px}
.card-form details{border-top:1px solid var(--line);padding-top:8px}
.card-form summary{cursor:pointer;color:var(--blue);font-weight:600}
.card-more{display:grid;grid-template-columns:1fr;gap:8px;padding:8px 0}
.empty{padding:20px;border:1px dashed #bdcfdc;background:var(--soft);border-radius:9px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:7px}
@media(max-width:750px){#layout{grid-template-columns:1fr}aside{display:flex;flex-wrap:wrap;gap:5px;padding:8px;border-right:0;border-bottom:1px solid var(--line)}aside button{display:inline-block;width:auto;margin:0;padding:7px}main{max-height:none}.profile-form{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){main{padding:12px}.profile-form{grid-template-columns:1fr}.profile-form .long{grid-column:auto}.entry-card{width:100%;height:215px}}
</style>
</head>
<body>
<header>
<h1>教師資料編輯器 / Faculty Manager</h1>
<select id="teacher-select" aria-label="選擇教師"></select>
<button id="new-teacher">＋ 新增教師</button>
<button id="save" class="primary">儲存變更</button>
</header>
<div id="status" role="status">讀取資料中…</div>
<div id="layout"><aside id="tabs"></aside><main id="editor"></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
let boot=null,model=null,originalId='',active='basic',dirty=false,busy=false;
let resizing=null,dragged=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;'}[c]));
function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function invoke(name,args,callback){
 if(busy)return;
 busy=true;document.querySelectorAll('header button').forEach(b=>b.disabled=true);status('處理中…');
 google.script.run.withSuccessHandler(result=>{
  busy=false;document.querySelectorAll('header button').forEach(b=>b.disabled=false);
  status('就緒');if(callback)callback(result);
 }).withFailureHandler(e=>{
  busy=false;document.querySelectorAll('header button').forEach(b=>b.disabled=false);
  status(e?.message||String(e),true);
 })[name](...(args||[]));
}
function changed(){dirty=true;status('尚未儲存 • 拖曳後按「儲存變更」才能同步 Google Sheets');}
function canLeave(){return !dirty||confirm('有尚未儲存的變更，確定捨棄？');}
function field(label,name,value,type='text',cls=''){
 const id='profile-'+name;
 if(type==='textarea')return '<label class="field '+cls+'">'+esc(label)+'<textarea data-profile="'+esc(name)+'">'+esc(value)+'</textarea></label>';
 return '<label class="field '+cls+'">'+esc(label)+'<input data-profile="'+esc(name)+'" type="'+type+'" value="'+esc(value)+'"></label>';
}
function chooser(){
 $('teacher-select').innerHTML=boot.teachers.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+' ('+esc(t.id)+')</option>').join('');
 $('teacher-select').value=originalId;
}
function renderTabs(){
 const items=[{key:'basic',zh:'基本資料',en:'Profile'},...boot.tabs];
 $('tabs').innerHTML=items.map(t=>'<button data-tab="'+esc(t.key)+'" class="'+(t.key===active?'selected':'')+'">'+esc(t.zh||t.en)+'</button>').join('');
 $('tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;renderTabs();render();});
}
function renderProfile(){
 const t=model.teacher;
 $('editor').innerHTML='<div class="topline"><h2>教師基本資料</h2><span class="hint">唯一識別碼：教師 ID</span></div>'+
 '<p class="hint">教師名單順序直接依 Teachers 工作表列順序；研究專長不需要個別 ID。</p>'+
 '<div class="profile-form">'+
 field('教師 ID（可修改）','teacher_id',t.teacher_id)+
 field('中文姓名','name_zh',t.name_zh)+field('English Name','name_en',t.name_en)+
 field('中文職稱','title_zh',t.title_zh)+field('English Title','title_en',t.title_en)+
 field('分類','category_key',t.category_key)+
 field('中文單位','unit_zh',t.unit_zh)+field('English Unit','unit_en',t.unit_en)+
 field('中文研究室','office_zh',t.office_zh)+field('English Office','office_en',t.office_en)+
 field('中文研究專長','expertise_zh',t.expertise_zh,'textarea','long')+
 field('Research Interests','expertise_en',t.expertise_en,'textarea','long')+
 field('Email','email',t.email,'email')+field('官方網址','profile_url',t.profile_url,'url')+
 field('教師照片網址','photo_url',t.photo_url,'url')+
 '<label class="field">發布狀態<select data-profile="publish_status"><option>DRAFT</option><option>PUBLISHED</option></select></label>'+
 '<div class="field"><span>語言顯示</span><label class="check"><input type="checkbox" data-profile="visible_zh">顯示中文</label>'+
 '<label class="check"><input type="checkbox" data-profile="visible_en">Show English</label></div></div>';
 const categoryInput=$('editor').querySelector('[data-profile="category_key"]');
 const cSelect=document.createElement('select');cSelect.dataset.profile='category_key';
 for(const c of boot.categories){const option=document.createElement('option');option.value=c.key;option.textContent=c.zh+' / '+c.en;cSelect.appendChild(option);}
 cSelect.value=t.category_key;categoryInput.replaceWith(cSelect);
 const st=$('editor').querySelector('[data-profile="publish_status"]');st.value=t.publish_status||'DRAFT';
 for(const k of ['visible_zh','visible_en'])$('editor').querySelector('[data-profile="'+k+'"]').checked=t[k]===true;
 $('editor').querySelectorAll('[data-profile]').forEach(el=>{
  el.addEventListener('input',()=>{
   t[el.dataset.profile]=el.type==='checkbox'?el.checked:el.value;changed();
  });
  el.addEventListener('change',()=>{
   t[el.dataset.profile]=el.type==='checkbox'?el.checked:el.value;changed();
  });
 });
}
function blankEntry(tab){
 return {section_key:tab,entry_type:'list_item',title_zh:'',title_en:'',content_zh:'',content_en:'',
 link_url:'',visible_zh:true,visible_en:true,field_values_json:'{}',card_width:290,card_height:190};
}
function sectionIndexes(){return model.entries.map((e,i)=>e.section_key===active?i:-1).filter(i=>i>=0);}
function entryField(index,key,label,value,type='text'){
 return '<label class="field">'+esc(label)+(type==='textarea'?
  '<textarea data-index="'+index+'" data-key="'+esc(key)+'">'+esc(value)+'</textarea>':
  '<input type="'+(type==='url'?'url':type==='number'?'number':'text')+'" data-index="'+index+'" data-key="'+esc(key)+'" value="'+esc(value)+'">')+'</label>';
}
function card(entry,index,number){
 let values={};
 try{values=JSON.parse(entry.field_values_json||'{}')}catch(_){}
 const title=entry.title_zh||entry.title_en||entry.content_zh||'未命名項目';
 const defs=boot.fields.filter(f=>f.section_key===active&&f.is_active);
 const custom=defs.map(f=>{
  const vals=values[f.key]||{};
  return entryField(index,'field:'+f.key+':zh',f.zh,vals.zh||'',f.type)+
         entryField(index,'field:'+f.key+':en',f.en,vals.en||'',f.type);
 }).join('');
 const w=Number(entry.card_width)||290,h=Number(entry.card_height)||190;
 return '<article class="entry-card" data-index="'+index+'" style="width:'+Math.max(230,Math.min(800,w))+'px;height:'+Math.max(120,Math.min(1200,h))+'px">'+
 '<div class="card-top"><span draggable="true" class="grab" title="拖曳改變順序" aria-label="拖曳排序">⠿</span>'+
 '<span class="card-title">'+number+'. '+esc(title.slice(0,70))+'</span>'+
 '<button data-toggle="'+index+'">編輯</button><button data-remove="'+index+'">刪除</button></div>'+
 '<div class="card-content"><p class="summary">'+esc((entry.content_zh||entry.content_en||'點擊「編輯」填寫中英文內容').slice(0,115))+'</p>'+
 '<div class="card-form" hidden>'+
 entryField(index,'title_zh','中文標題',entry.title_zh)+entryField(index,'title_en','English title',entry.title_en)+
 entryField(index,'content_zh','中文內容',entry.content_zh,'textarea')+
 entryField(index,'content_en','English content',entry.content_en,'textarea')+
 entryField(index,'link_url','相關連結',entry.link_url,'url')+
 '<label class="check"><input type="checkbox" data-index="'+index+'" data-key="visible_zh" '+(entry.visible_zh===true?'checked':'')+'>中文公開</label>'+
 '<label class="check"><input type="checkbox" data-index="'+index+'" data-key="visible_en" '+(entry.visible_en===true?'checked':'')+'>English visible</label>'+
 '<label class="field">顯示方式<select data-index="'+index+'" data-key="entry_type"><option value="list_item" '+(entry.entry_type==='list_item'?'selected':'')+'>清單</option><option value="text" '+(entry.entry_type==='text'?'selected':'')+'>段落</option></select></label>'+
 (custom?'<details><summary>自訂欄位（中英文）</summary><div class="card-more">'+custom+'</div></details>':'')+
 '</div></div></article>';
}
function updateField(index,key,value){
 const entry=model.entries[index];if(!entry)return;
 if(key.startsWith('field:')){
  const [_,fieldKey,lang]=key.split(':');let fields={};
  try{fields=JSON.parse(entry.field_values_json||'{}')}catch(_){}
  fields[fieldKey]={...(fields[fieldKey]||{}),[lang]:value};
  entry.field_values_json=JSON.stringify(fields);
 }else entry[key]=value;
 changed();
}
function renderEntries(){
 const tab=boot.tabs.find(t=>t.key===active);
 const indexes=sectionIndexes();
 $('editor').innerHTML='<div class="topline"><h2>'+esc(tab?.zh||active)+' / '+esc(tab?.en||'')+'</h2>'+
 '<div class="actions"><button class="primary" id="add-entry">＋ 新增'+esc(tab?.zh||'項目')+'</button></div></div>'+
 '<p class="hint">不用項目 ID、不用排序欄。拖曳左上角 ⠿ 改變排列；拖動卡片右下角可以縮放；「編輯」展開詳細內容。儲存後會把新順序寫回 Sheet。</p>'+
 (indexes.length?'<section class="card-board" id="cards">'+indexes.map((i,n)=>card(model.entries[i],i,n+1)).join('')+'</section>':
 '<p class="empty">這個分頁尚無資料。按「＋ 新增」即可建立。</p>');
 $('add-entry').onclick=()=>{
  model.entries.push(blankEntry(active));changed();renderEntries();
  const element=$('cards')?.lastElementChild;const b=element?.querySelector('[data-toggle]');if(b)b.click();
 };
 const cards=$('cards');if(!cards)return;
 cards.addEventListener('input',e=>{
  const el=e.target.closest('[data-key]');
  if(!el)return;updateField(Number(el.dataset.index),el.dataset.key,el.type==='checkbox'?el.checked:el.value);
 });
 cards.addEventListener('change',e=>{
  const el=e.target.closest('[data-key]');
  if(!el)return;updateField(Number(el.dataset.index),el.dataset.key,el.type==='checkbox'?el.checked:el.value);
 });
 cards.querySelectorAll('[data-toggle]').forEach(btn=>btn.onclick=()=>{
  const box=btn.closest('.entry-card'),form=box.querySelector('.card-form'),sum=box.querySelector('.summary');
  form.hidden=!form.hidden;sum.hidden=!form.hidden;btn.textContent=form.hidden?'編輯':'收合';
 });
 cards.querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=()=>{
  if(confirm('確定刪除這筆資料？儲存後才會寫回試算表。')){
   model.entries.splice(Number(btn.dataset.remove),1);changed();renderEntries();
  }
 });
 cards.querySelectorAll('.grab').forEach(handle=>{
  handle.addEventListener('dragstart',event=>{
   dragged=Number(handle.closest('.entry-card').dataset.index);
   handle.closest('.entry-card').classList.add('dragging');
   event.dataTransfer.effectAllowed='move';
   event.dataTransfer.setData('text/plain',String(dragged));
  });
  handle.addEventListener('dragend',()=>{
   dragged=null;cards.querySelectorAll('.entry-card').forEach(el=>el.classList.remove('dragging','target'));
  });
 });
 cards.querySelectorAll('.entry-card').forEach(el=>{
  el.addEventListener('dragover',event=>{if(dragged===null)return;event.preventDefault();el.classList.add('target');});
  el.addEventListener('dragleave',()=>el.classList.remove('target'));
  el.addEventListener('drop',event=>{
   event.preventDefault();el.classList.remove('target');
   const target=Number(el.dataset.index);
   if(dragged===null||dragged===target)return;
   const positions=sectionIndexes(),list=positions.map(p=>model.entries[p]);
   const from=positions.indexOf(dragged),to=positions.indexOf(target);
   if(from<0||to<0)return;
   const item=list.splice(from,1)[0];list.splice(to,0,item);
   positions.forEach((p,i)=>model.entries[p]=list[i]);
   dragged=null;changed();renderEntries();
  });
  // Persist the size only after a deliberate pointer action on the native resize corner.
  el.addEventListener('pointerdown',event=>{
   const rect=el.getBoundingClientRect();
   if(rect.right-event.clientX<=26&&rect.bottom-event.clientY<=26)
    resizing={element:el,index:Number(el.dataset.index),w:rect.width,h:rect.height};
  });
 });
}
document.addEventListener('pointerup',()=>{
 if(!resizing)return;
 const {element,index,w,h}=resizing;resizing=null;
 if(!element.isConnected)return;
 const rect=element.getBoundingClientRect();
 if(Math.abs(rect.width-w)>5||Math.abs(rect.height-h)>5){
  model.entries[index].card_width=Math.round(rect.width);
  model.entries[index].card_height=Math.round(rect.height);
  changed();
 }
});
function render(){if(!model){$('editor').textContent='請選擇教師';return;}if(active==='basic')renderProfile();else renderEntries();}
function loadTeacher(id){
 invoke('ftvGetTeacher',[id],result=>{
  model=result;originalId=String(model.teacher.teacher_id);active='basic';dirty=false;
  chooser();renderTabs();render();status('已載入 '+(model.teacher.name_zh||originalId));
 });
}
function loadBootstrap(selectId){
 invoke('ftvGetBootstrap',[],result=>{
  boot=result;originalId=selectId||boot.teachers[0]?.id||'';
  chooser();
  if(originalId)loadTeacher(originalId);
  else{status('尚未建立教師');renderTabs();render();}
 });
}
$('teacher-select').addEventListener('change',e=>{
 if(!canLeave()){e.target.value=originalId;return;}
 loadTeacher(e.target.value);
});
$('new-teacher').onclick=()=>{
 if(!canLeave())return;
 const id=prompt('請輸入新教師 ID（例如 BMST008）。只有教師需要 ID：');
 if(id===null)return;
 if(!id.trim()){status('教師 ID 不可空白',true);return;}
 invoke('ftvCreateTeacher',[id.trim()],result=>{dirty=false;loadBootstrap(result.id);});
};
$('save').onclick=()=>{
 if(!model||busy)return;
 const payload={originalTeacherId:originalId,teacher:model.teacher,entries:model.entries,revision:model.revision};
 invoke('ftvSaveTeacher',[payload],result=>{
  dirty=false;model=result;originalId=String(result.teacher.teacher_id);
  loadBootstrap(originalId);status('已儲存；如要更新公開網站，請另行發布 JSON');
 });
};
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
loadBootstrap();
</script>
</body>
</html>
