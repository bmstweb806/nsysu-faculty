<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--blue:#17618c;--ink:#263847;--muted:#647786;--line:#d8e2e9;--soft:#f4f8fa}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font:14px/1.45 Arial,"Noto Sans TC",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;background:#fff;border:1px solid #b8cddc;border-radius:7px;padding:7px 11px;color:var(--blue)}
button:hover{background:#eaf3f8}button.primary{color:#fff;background:var(--blue);border-color:var(--blue)}button:disabled{opacity:.45;cursor:wait}
header{background:#123e5b;color:#fff;padding:12px 18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
header h1{font-size:18px;margin:0 auto 0 0}
header select{background:white;color:var(--ink);padding:8px;border-radius:7px;max-width:220px}
#status{padding:8px 18px;color:#175b80;border-bottom:1px solid var(--line);min-height:36px}
#status.error{color:#a72134;background:#fff3f3}
#layout{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:500px}
aside{border-right:1px solid var(--line);padding:13px;background:var(--soft)}
aside button{display:block;width:100%;text-align:left;margin:0 0 6px;border:0;background:none;padding:10px 11px;color:#2d4a60}
aside button.selected{background:var(--blue);color:#fff;font-weight:700}
main{padding:15px 18px;max-height:calc(100vh - 130px);overflow:auto;min-height:420px}
.topline{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:9px}
h2{font-size:19px;margin:0}p.hint{color:var(--muted);font-size:12px;margin:6px 0 13px}
label{font-size:12px;color:#435c70;font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
input,textarea,select{width:100%;padding:8px;border:1px solid #b5c6d3;border-radius:6px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:65px}
.profile-sheet{max-width:1040px;display:flex;flex-direction:column;gap:22px}
.profile-section{padding:0 0 22px;border-bottom:1px solid var(--line)}
.profile-section:last-child{border-bottom:0;padding-bottom:12px}
.profile-section-heading{display:flex;align-items:center;gap:12px;margin:0 0 15px}
.profile-section-heading h3{margin:0;font-size:15px;font-weight:700;color:#23485f;letter-spacing:.01em}
.profile-section-heading::after{content:"";height:1px;background:#e4edf2;flex:1}
.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 18px;align-items:start}
.profile-grid .field{width:100%}
.profile-grid .field input,.profile-grid .field select{min-height:39px}
.profile-grid .field textarea{min-height:120px;resize:vertical;line-height:1.6}
.profile-grid .span-full{grid-column:1/-1}
.profile-identity-layout{display:grid;grid-template-columns:114px minmax(0,1fr);gap:22px;align-items:start}
.profile-photo{width:114px;height:143px;background:#eff4f7;border:1px solid #dbe5eb;border-radius:9px;display:flex;justify-content:center;align-items:center;overflow:hidden}
.profile-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.profile-photo img[hidden]{display:none!important}
.profile-photo-placeholder{font-size:12px;color:#91a1ad}
.profile-photo-placeholder[hidden]{display:none!important}
.profile-media-caption{margin-top:6px;font-size:11px;color:#8799a5;text-align:center}
.profile-publish{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:20px;align-items:end}
.profile-visibility{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.profile-visibility .check{display:inline-flex;align-items:center;gap:9px;margin:0;min-height:40px;border:1px solid #d4e1e9;border-radius:7px;padding:8px 12px;background:#f8fbfd;color:#344e61;font-weight:600;font-size:13px}
.profile-visibility .check input{width:16px;height:16px;margin:0;accent-color:var(--blue)}
@media(max-width:850px){.profile-identity-layout{grid-template-columns:92px minmax(0,1fr);gap:15px}.profile-photo{width:92px;height:118px}.profile-section{padding-bottom:20px}}
@media(max-width:560px){.profile-grid,.profile-publish{grid-template-columns:1fr}.profile-identity-layout{grid-template-columns:1fr}.profile-photo-column{display:flex;align-items:center;gap:12px}.profile-photo{width:76px;height:90px}.profile-media-caption{margin:0;text-align:left}.profile-sheet{gap:18px}.profile-section{padding-bottom:18px}}
.check{display:inline-flex;gap:6px;align-items:center;margin:4px 10px 4px 0}
.check input{width:auto}
.card-board{display:flex;flex-direction:column;gap:8px;margin:10px 0 18px}
.entry-card{width:100%;min-width:0;height:auto;border:1px solid #cddce5;border-radius:8px;background:#fff;overflow:hidden;box-shadow:0 1px 3px #0c3b5808}
.entry-card.dragging{opacity:.5}.entry-card.target{outline:2px dashed var(--blue);outline-offset:2px}
.entry-card.is-open{border-color:#a6c7dc;box-shadow:0 2px 9px #0c3b5810}
.card-top{height:42px;min-height:42px;display:flex;align-items:center;gap:9px;background:#f7f9fa;padding:0 11px}
.entry-card.is-open .card-top{background:#ebf3f8}
.grab{cursor:grab;user-select:none;color:#708b9b;font-size:19px;line-height:1;padding:5px;border-radius:5px}
.grab:active{cursor:grabbing}
.card-title{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-toggle{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:36px;height:32px;border:0;background:transparent;padding:3px 6px;color:#315a75}
.card-toggle:hover{background:#dcebf3}
.card-toggle .caret{font-size:15px;display:inline-block;transition:transform .15s ease}
.card-toggle[aria-expanded="true"] .caret{transform:rotate(90deg)}
.card-content{border-top:1px solid #d8e4ec;padding:14px 16px 18px;background:#fff;overflow:auto;resize:vertical;min-height:190px;max-height:78vh;height:auto}
.card-content[hidden]{display:none!important}
.card-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 15px}
.card-form>.field:has(textarea){grid-column:auto}
.card-form .field{gap:4px}
.card-form textarea{min-height:75px}
.card-form details{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}
.card-form summary{cursor:pointer;color:var(--blue);font-weight:600}
.card-more{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;padding:10px 0}
.card-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.card-actions .danger{border-color:#e0b8be;color:#a52e40}
[hidden]{display:none!important}
aside .side-heading{font-size:12px;color:#728697;font-weight:700;padding:5px 10px 9px}
aside .add-category{width:100%;border:1px dashed #96b5c9;background:#fff;color:var(--blue);text-align:center;font-weight:700;margin-top:9px}
aside .category-form{border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px 10px;display:grid;gap:9px;margin-top:10px}
aside .category-form label{display:grid;gap:3px}
aside .category-form input{padding:7px}
aside .category-form .row{display:flex;gap:5px}
aside .category-form .row button{width:auto;margin:0;border:1px solid #b8cddc;background:#fff;text-align:center}
aside .category-form .row .primary{background:var(--blue);color:white}
.empty{padding:20px;border:1px dashed #bdcfdc;background:var(--soft);border-radius:9px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:7px}
@media(max-width:750px){#layout{grid-template-columns:1fr}aside{display:flex;flex-wrap:wrap;gap:5px;padding:8px;border-right:0;border-bottom:1px solid var(--line)}aside button{display:inline-block;width:auto;margin:0;padding:7px}main{max-height:none}.profile-form{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){main{padding:12px}.profile-form{grid-template-columns:1fr}.profile-form .long{grid-column:auto}.card-form,.card-more{grid-template-columns:1fr}.card-content{padding:11px}}

/* Minimal visual hierarchy: navigation · content · actions */
header{padding:13px 20px;gap:9px}
header h1{font-size:17px;font-weight:700;letter-spacing:.02em}
header select{max-width:230px}
header button.primary{background:#eaf4fa;border-color:#eaf4fa;color:#164965;font-weight:700}
header button.primary:hover{background:#fff}
#status{min-height:0;padding:0;margin-left:2px;border:0;background:none;color:#bad6e6;font-size:12px;white-space:nowrap}
#status.error{color:#ffc2cb;background:none}
#status.dirty{color:#ffe0a8}
#layout{grid-template-columns:198px minmax(0,1fr)}
aside{padding:16px 10px}
aside button{padding:9px 12px;margin:0 0 4px;border-radius:7px}
aside button:hover{background:#e8f0f5}
aside button.selected{background:var(--blue)}
aside .side-heading{padding:5px 12px 11px;font-size:11px;letter-spacing:.07em;color:#8a9ca8}
aside .add-category{margin-top:12px;border-color:#bdd0dc}
main{padding:24px 28px;max-height:calc(100vh - 90px)}
.topline{margin-bottom:18px}
.topline h2{font-size:21px}
.topline-heading{display:flex;align-items:baseline;gap:9px}
.topline-heading small{color:#8695a0;font-size:12px}
.card-board{margin:0 0 16px;gap:7px}
.card-top{height:40px;min-height:40px;background:#fff}
.entry-card.is-open .card-top{background:#eef5f9}
.entry-card{box-shadow:none}
.entry-card:hover{border-color:#a6c5d9}
.empty{text-align:center;padding:42px 15px;border-color:#d4e0e8;background:#fbfcfd}
@media(max-width:750px){
 #layout{grid-template-columns:1fr}
 aside .side-heading{display:none}
 aside .add-category{width:auto;margin:0}
 main{padding:16px 13px;max-height:none}
 #status{width:100%;text-align:right}
}

body.auth-locked>header,body.auth-locked>#layout{display:none!important}
#login-screen{display:none;min-height:100vh;align-items:center;justify-content:center;background:#f3f7fa;padding:20px}
body.auth-locked #login-screen{display:flex}
.login-panel{width:100%;max-width:390px;background:#fff;border:1px solid #dce6ed;border-radius:13px;box-shadow:0 12px 40px #123e5b14;padding:30px}
.login-panel h2{margin:0 0 6px;font-size:22px;color:#123e5b}
.login-panel p{margin:0 0 20px;font-size:13px;color:#728596}
.login-panel label{display:grid;gap:6px;font-size:13px;font-weight:600;margin:12px 0}
.login-panel input{width:100%;padding:11px 12px;border:1px solid #bfd1dd;border-radius:7px}
.login-panel button{width:100%;padding:10px;margin-top:8px}
.login-panel .login-error{min-height:20px;margin-top:12px;color:#ac3142;font-size:12px}
#logout{background:transparent;color:#e7f2f7;border:1px solid #61849c}
#account-name{font-size:12px;color:#b9d7e6}
</style>
</head>
<body class="auth-locked">
<div id="login-screen"><div class="login-panel">
<h2>教師資料管理</h2><p>Faculty Management · Email 驗證碼登入</p>
<form id="otp-request-form">
<label>電子郵件<input id="login-email" type="email" autocomplete="email" required placeholder="name@mail.nsysu.edu.tw"></label>
<button class="primary" type="submit">寄送驗證碼</button>
</form>
<form id="otp-verify-form" hidden>
<label>6 位數驗證碼<input id="login-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label>
<button class="primary" type="submit">驗證並登入</button>
</form>
<div id="login-error" class="login-error" role="status" aria-live="polite"></div>
</div></div>
<header>
<h1>教師管理</h1><span id="account-name"></span><button id="logout" type="button">登出</button>
<select id="teacher-select" aria-label="選擇教師"></select>
<button id="new-teacher">＋ 教師</button>
<button id="save" class="primary">儲存</button>
<span id="status" role="status" aria-live="polite">載入中…</span>
</header>
<div id="layout"><aside id="tabs"></aside><main id="editor"></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
let boot=null,model=null,originalId='',active='basic',dirty=false,busy=false;
let resizing=null,dragged=null;
let authToken='',authAccount=null,loginBusy=false;
function loginMessage(text,error=false){
 const el=$('login-error');el.textContent=text;el.style.color=error?'#ac3142':'#42778d';
}
function loginCall(name,args,success){
 if(loginBusy)return;loginBusy=true;
 document.querySelectorAll('#login-screen button').forEach(b=>b.disabled=true);
 google.script.run.withSuccessHandler(result=>{
  loginBusy=false;document.querySelectorAll('#login-screen button').forEach(b=>b.disabled=false);
  success(result);
 }).withFailureHandler(err=>{
  loginBusy=false;document.querySelectorAll('#login-screen button').forEach(b=>b.disabled=false);
  loginMessage(err?.message||String(err),true);
 })[name](...args);
}
$('otp-request-form').addEventListener('submit',e=>{
 e.preventDefault();
 loginMessage('寄送中…');
 loginCall('ftaRequestCode',[$('login-email').value.trim()],result=>{
  $('otp-verify-form').hidden=false;
  loginMessage(result.message||'請檢查電子郵件');
  $('login-code').focus();
 });
});
$('otp-verify-form').addEventListener('submit',e=>{
 e.preventDefault();
 loginMessage('驗證中…');
 loginCall('ftaVerifyCode',[$('login-email').value.trim(),$('login-code').value.trim()],result=>{
  authToken=result.token;authAccount=result.account;
  document.body.classList.remove('auth-locked');
  $('account-name').textContent=authAccount.email;
  $('new-teacher').hidden=authAccount.role!=='ADMIN';
  $('teacher-select').hidden=authAccount.role!=='ADMIN';
  loadBootstrap();
 });
});
$('logout').addEventListener('click',()=>{
 const token=authToken;
 authToken='';authAccount=null;boot=null;model=null;dirty=false;
 document.body.classList.add('auth-locked');
 $('login-code').value='';$('otp-verify-form').hidden=true;
 loginMessage('已登出');
 if(token)google.script.run.ftaLogout(token);
});

const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;'}[c]));
function status(message,error=false){
 $('status').textContent=message;
 $('status').classList.toggle('error',error);
 $('status').classList.toggle('dirty',!error&&message==='未儲存');
}
function invoke(name,args,callback){
 if(busy)return;
 busy=true;document.querySelectorAll('header button').forEach(b=>b.disabled=true);status('處理中…');
 google.script.run.withSuccessHandler(result=>{
  busy=false;document.querySelectorAll('header button').forEach(b=>b.disabled=false);
  status('就緒');if(callback)callback(result);
 }).withFailureHandler(e=>{
  busy=false;document.querySelectorAll('header button').forEach(b=>b.disabled=false);
  status(e?.message||String(e),true);
 })[name](...(args||[]),authToken);
}
function changed(){dirty=true;status('未儲存');}
function canLeave(){return !dirty||confirm('有尚未儲存的變更，確定捨棄？');}
function field(label,name,value,type='text',cls=''){
 const id='profile-'+name;
 if(type==='textarea')return '<label class="field '+cls+'">'+esc(label)+'<textarea data-profile="'+esc(name)+'">'+esc(value)+'</textarea></label>';
 return '<label class="field '+cls+'">'+esc(label)+'<input data-profile="'+esc(name)+'" type="'+type+'" value="'+esc(value)+'"></label>';
}
function chooser(){
 $('teacher-select').innerHTML=boot.teachers.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+' ('+esc(t.id)+')</option>').join('');
 $('teacher-select').value=originalId;
}
function renderTabs(){
 const items=[{key:'basic',zh:'基本資料',en:'Profile'},...boot.tabs];
 $('tabs').innerHTML='<div class="side-heading">內容分類</div>'+
  items.map(t=>'<button type="button" data-tab="'+esc(t.key)+'" class="'+(t.key===active?'selected':'')+'">'+esc(t.zh||t.en)+'</button>').join('')+
  '<button id="add-category-toggle" type="button" class="add-category">＋ 分類</button>'+
  '<form id="new-category-form" class="category-form" hidden>'+
  '<label>分類名稱<input id="new-category-zh" maxlength="150" required placeholder="例如：專利"></label>'+
  '<label>English<input id="new-category-en" maxlength="150" placeholder="Patents"></label>'+
  '<div class="row"><button class="primary" type="submit">建立分類</button>'+
  '<button id="cancel-category" type="button">取消</button></div></form>';
 $('add-category-toggle').hidden=authAccount?.role!=='ADMIN';
 $('tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
   active=b.dataset.tab;renderTabs();render();
 });
 const form=$('new-category-form');
 $('add-category-toggle').onclick=()=>{
   form.hidden=false;$('add-category-toggle').hidden=true;
   $('new-category-zh').focus();
 };
 $('cancel-category').onclick=()=>{form.hidden=true;$('add-category-toggle').hidden=false;};
 form.addEventListener('submit',e=>{
   e.preventDefault();
   const zh=$('new-category-zh').value.trim(),en=$('new-category-en').value.trim();
   if(!zh){status('請輸入分類名稱',true);return;}
   invoke('fcfgCreateTab',[zh,en],tab=>{
     boot.tabs.push(tab);active=tab.key;
     renderTabs();render();
     status('已建立：'+tab.zh+'（尚未發布）');
   });
 });
}
function renderProfile(){
 const t=model.teacher;
 const heading=name=>'<div class="profile-section-heading"><h3>'+esc(name)+'</h3></div>';
 $('editor').innerHTML='<div class="topline"><h2>基本資料</h2></div>'+
 '<div class="profile-sheet">'+
 '<section class="profile-section">'+heading('教師身分')+
 '<div class="profile-identity-layout">'+
 '<div class="profile-photo-column"><div class="profile-photo">'+
 '<img id="profile-photo-preview" alt="教師照片" hidden>'+
 '<span class="profile-photo-placeholder" id="profile-photo-placeholder">尚無照片</span></div>'+
 '<div class="profile-media-caption">照片預覽</div></div>'+
 '<div class="profile-grid">'+
 field('中文姓名','name_zh',t.name_zh)+
 field('English Name','name_en',t.name_en)+
 field('中文職稱','title_zh',t.title_zh)+
 field('English Title','title_en',t.title_en)+
 field('教師 ID','teacher_id',t.teacher_id)+
 '<label class="field">教師分類<select data-profile="category_key"></select></label>'+
 '</div></div></section>'+
 '<section class="profile-section">'+heading('任職資訊')+
 '<div class="profile-grid">'+
 field('中文單位','unit_zh',t.unit_zh)+
 field('English Unit','unit_en',t.unit_en)+
 field('中文研究室','office_zh',t.office_zh)+
 field('English Office','office_en',t.office_en)+
 '</div></section>'+
 '<section class="profile-section">'+heading('研究專長')+
 '<div class="profile-grid">'+
 field('中文','expertise_zh',t.expertise_zh,'textarea')+
 field('English','expertise_en',t.expertise_en,'textarea')+
 '</div></section>'+
 '<section class="profile-section">'+heading('聯絡與連結')+
 '<div class="profile-grid">'+
 field('Email','email',t.email,'email')+
 field('官方教師頁面','profile_url',t.profile_url,'url')+
 field('照片網址','photo_url',t.photo_url,'url','span-full')+
 '</div></section>'+
 '<section class="profile-section">'+heading('發布設定')+
 '<div class="profile-publish">'+
 '<label class="field">狀態<select data-profile="publish_status">'+
 '<option value="DRAFT">草稿 / Draft</option>'+
 '<option value="PUBLISHED">已發布 / Published</option></select></label>'+
 '<div class="profile-visibility">'+
 '<label class="check"><input type="checkbox" data-profile="visible_zh">中文顯示</label>'+
 '<label class="check"><input type="checkbox" data-profile="visible_en">English</label>'+
 '</div></div></section>'+
 '</div>';
 const cat=$('editor').querySelector('[data-profile="category_key"]');
 for(const c of boot.categories){
   const option=document.createElement('option');
   option.value=c.key;option.textContent=c.zh+' / '+c.en;
   cat.appendChild(option);
 }
 cat.value=t.category_key;
 if(authAccount?.role!=='ADMIN'){
  for(const k of ['teacher_id','category_key','publish_status','visible_zh','visible_en']){
   const el=$('editor').querySelector('[data-profile="'+k+'"]');
   if(el)el.disabled=true;
  }
 }
 const statusSelect=$('editor').querySelector('[data-profile="publish_status"]');
 statusSelect.value=t.publish_status||'DRAFT';
 for(const k of ['visible_zh','visible_en']){
   $('editor').querySelector('[data-profile="'+k+'"]').checked=t[k]===true;
 }
 const image=$('profile-photo-preview'),placeholder=$('profile-photo-placeholder');
 function showPhoto(url){
   const source=String(url||'').trim();
   image.hidden=true;placeholder.hidden=false;
   image.removeAttribute('src');
   if(!/^https?:\/\/\S+$/i.test(source))return;
   image.onload=()=>{image.hidden=false;placeholder.hidden=true;};
   image.onerror=()=>{image.hidden=true;placeholder.hidden=false;};
   image.src=source;
 }
 showPhoto(t.photo_url);
 $('editor').querySelectorAll('[data-profile]').forEach(el=>{
   function update(){
     t[el.dataset.profile]=el.type==='checkbox'?el.checked:el.value;
     if(el.dataset.profile==='photo_url')showPhoto(el.value);
     changed();
   }
   el.addEventListener('input',update);
   if(el.tagName==='SELECT'||el.type==='checkbox')el.addEventListener('change',update);
 });
}
function blankEntry(tab){
 return {section_key:tab,entry_type:'list_item',title_zh:'',title_en:'',content_zh:'',content_en:'',
 link_url:'',visible_zh:true,visible_en:true,field_values_json:'{}',card_width:290,card_height:190};
}
function sectionIndexes(){return model.entries.map((e,i)=>e.section_key===active?i:-1).filter(i=>i>=0);}
function entryField(index,key,label,value,type='text'){
 return '<label class="field">'+esc(label)+(type==='textarea'?
  '<textarea data-index="'+index+'" data-key="'+esc(key)+'">'+esc(value)+'</textarea>':
  '<input type="'+(type==='url'?'url':type==='number'?'number':'text')+'" data-index="'+index+'" data-key="'+esc(key)+'" value="'+esc(value)+'">')+'</label>';
}
function card(entry,index,number){
 let values={};
 try{values=JSON.parse(entry.field_values_json||'{}')}catch(_){}
 const title=entry.title_zh||entry.title_en||entry.content_zh||entry.content_en||'未命名項目';
 const defs=boot.fields.filter(f=>f.section_key===active&&f.is_active);
 const custom=defs.map(f=>{
  const val=values[f.key]||{};
  return entryField(index,'field:'+f.key+':zh',f.zh,val.zh||'',f.type)+
         entryField(index,'field:'+f.key+':en',f.en,val.en||'',f.type);
 }).join('');
 const savedHeight=Number(entry.card_height);
 const heightStyle=Number.isFinite(savedHeight)&&savedHeight>=260
   ?' style="height:'+Math.min(1200,Math.round(savedHeight))+'px"':'';
 return '<article class="entry-card" data-index="'+index+'">'+
  '<div class="card-top">'+
  '<span class="grab" draggable="true" title="拖曳調整排列順序" aria-label="拖曳排序">⠿</span>'+
  '<span class="card-title">'+number+'. '+esc(title.slice(0,100))+'</span>'+
  '<button type="button" class="card-toggle" data-toggle="'+index+'" aria-expanded="false" aria-label="展開或收合 '+esc(title.slice(0,40))+'"><span class="caret">▶</span></button>'+
  '</div>'+
  '<div class="card-content" hidden'+heightStyle+'>'+
  '<div class="card-form">'+
  entryField(index,'title_zh','中文標題',entry.title_zh)+entryField(index,'title_en','English title',entry.title_en)+
  entryField(index,'content_zh','中文內容',entry.content_zh,'textarea')+
  entryField(index,'content_en','English content',entry.content_en,'textarea')+
  entryField(index,'link_url','相關連結',entry.link_url,'url')+
  '<label class="field">顯示方式<select data-index="'+index+'" data-key="entry_type">'+
  '<option value="list_item" '+(entry.entry_type==='list_item'?'selected':'')+'>清單</option>'+
  '<option value="text" '+(entry.entry_type==='text'?'selected':'')+'>段落</option></select></label>'+
  '<label class="check"><input type="checkbox" data-index="'+index+'" data-key="visible_zh" '+(entry.visible_zh===true?'checked':'')+'>中文公開</label>'+
  '<label class="check"><input type="checkbox" data-index="'+index+'" data-key="visible_en" '+(entry.visible_en===true?'checked':'')+'>English visible</label>'+
  (custom?'<details><summary>更多自訂欄位（中英文）</summary><div class="card-more">'+custom+'</div></details>':'')+
  '<div class="card-actions"><button type="button" class="danger" data-remove="'+index+'">刪除這筆內容</button></div>'+
  '</div></div></article>';
}
function updateField(index,key,value){
 const entry=model.entries[index];if(!entry)return;
 if(key.startsWith('field:')){
  const [_,fieldKey,lang]=key.split(':');let fields={};
  try{fields=JSON.parse(entry.field_values_json||'{}')}catch(_){}
  fields[fieldKey]={...(fields[fieldKey]||{}),[lang]:value};
  entry.field_values_json=JSON.stringify(fields);
 }else entry[key]=value;
 changed();
}
function renderEntries(){
 const tab=boot.tabs.find(t=>t.key===active);
 const indexes=sectionIndexes();
 $('editor').innerHTML='<div class="topline"><div class="topline-heading"><h2>'+esc(tab?.zh||active)+'</h2><small>'+esc(tab?.en||'')+'</small></div>'+
  '<div class="actions"><button class="primary" id="add-entry" type="button">＋ 新增</button></div></div>'+
  
  (indexes.length?'<section class="card-board" id="cards">'+indexes.map((i,n)=>card(model.entries[i],i,n+1)).join('')+'</section>':
  '<p class="empty">尚無內容</p>');
 $('add-entry').onclick=()=>{
   const positions=sectionIndexes();
   const insertAt=positions.length?positions[0]:0;
   model.entries.splice(insertAt,0,blankEntry(active));
   changed();renderEntries();
   // Existing rows start closed. A newly created row opens immediately for editing.
   const first=$('cards')?.querySelector('[data-toggle]');
   if(first){first.click();$('cards').querySelector('[data-key="title_zh"]')?.focus();}
 };
 const board=$('cards');if(!board)return;
 board.addEventListener('input',e=>{
   const el=e.target.closest('[data-key]');
   if(!el)return;
   updateField(Number(el.dataset.index),el.dataset.key,el.type==='checkbox'?el.checked:el.value);
   const k=el.dataset.key;
   if(k==='title_zh'||k==='title_en'||k==='content_zh'||k==='content_en'){
     const item=el.closest('.entry-card');
     const r=model.entries[Number(el.dataset.index)];
     const title=r.title_zh||r.title_en||r.content_zh||r.content_en||'未命名項目';
     const position=[...board.children].indexOf(item)+1;
     item.querySelector('.card-title').textContent=position+'. '+title.slice(0,100);
   }
 });
 board.addEventListener('change',e=>{
   const el=e.target.closest('[data-key]');
   if(!el)return;
   updateField(Number(el.dataset.index),el.dataset.key,el.type==='checkbox'?el.checked:el.value);
 });
 board.querySelectorAll('[data-toggle]').forEach(btn=>btn.onclick=()=>{
   const item=btn.closest('.entry-card'),body=item.querySelector('.card-content');
   const open=btn.getAttribute('aria-expanded')==='true';
   body.hidden=open;
   btn.setAttribute('aria-expanded',String(!open));
   item.classList.toggle('is-open',!open);
   btn.setAttribute('aria-label',open?'展開內容':'收合內容');
 });
 board.querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=()=>{
   if(confirm('確定刪除這筆內容？儲存後才會寫回 Google Sheets。')){
     model.entries.splice(Number(btn.dataset.remove),1);
     changed();renderEntries();
   }
 });
 board.querySelectorAll('.grab').forEach(handle=>{
   handle.addEventListener('dragstart',event=>{
     dragged=Number(handle.closest('.entry-card').dataset.index);
     handle.closest('.entry-card').classList.add('dragging');
     event.dataTransfer.effectAllowed='move';
     event.dataTransfer.setData('text/plain',String(dragged));
   });
   handle.addEventListener('dragend',()=>{
     dragged=null;
     board.querySelectorAll('.entry-card').forEach(x=>x.classList.remove('dragging','target'));
   });
 });
 board.querySelectorAll('.entry-card').forEach(item=>{
   item.addEventListener('dragover',e=>{
     if(dragged===null)return;
     e.preventDefault();item.classList.add('target');
   });
   item.addEventListener('dragleave',()=>item.classList.remove('target'));
   item.addEventListener('drop',e=>{
     e.preventDefault();item.classList.remove('target');
     const target=Number(item.dataset.index);
     if(dragged===null||dragged===target)return;
     const positions=sectionIndexes();
     const list=positions.map(p=>model.entries[p]);
     const from=positions.indexOf(dragged),to=positions.indexOf(target);
     if(from<0||to<0)return;
     const moved=list.splice(from,1)[0];list.splice(to,0,moved);
     positions.forEach((p,i)=>model.entries[p]=list[i]);
     dragged=null;changed();renderEntries();
   });
   const body=item.querySelector('.card-content');
   body.addEventListener('pointerdown',e=>{
     if(body.hidden)return;
     const box=body.getBoundingClientRect();
     if(box.right-e.clientX<=22&&box.bottom-e.clientY<=22)
       resizing={element:body,index:Number(item.dataset.index),height:box.height};
   });
 });
}
document.addEventListener('pointerup',()=>{
 if(!resizing)return;
 const {element,index,height}=resizing;resizing=null;
 if(!element.isConnected)return;
 const next=Math.round(element.getBoundingClientRect().height);
 if(Math.abs(next-height)>5){model.entries[index].card_height=next;changed();}
});
function render(){if(!model){$('editor').textContent='請選擇教師';return;}if(active==='basic')renderProfile();else renderEntries();}
function loadTeacher(id){
 invoke('ftvGetTeacher',[id],result=>{
  model=result;originalId=String(model.teacher.teacher_id);active='basic';dirty=false;
  chooser();renderTabs();render();status('已載入');
 });
}
function loadBootstrap(selectId){
 invoke('ftvGetBootstrap',[],result=>{
  boot=result;originalId=selectId||boot.teachers[0]?.id||'';
  chooser();
  if(originalId)loadTeacher(originalId);
  else{status('尚未建立教師');renderTabs();render();}
 });
}
$('teacher-select').addEventListener('change',e=>{
 if(!canLeave()){e.target.value=originalId;return;}
 loadTeacher(e.target.value);
});
$('new-teacher').onclick=()=>{
 if(!canLeave())return;
 const id=prompt('請輸入新教師 ID（例如 BMST008）。只有教師需要 ID：');
 if(id===null)return;
 if(!id.trim()){status('教師 ID 不可空白',true);return;}
 invoke('ftvCreateTeacher',[id.trim()],result=>{dirty=false;loadBootstrap(result.id);});
};
$('save').onclick=()=>{
 if(!model||busy)return;
 const payload={originalTeacherId:originalId,teacher:model.teacher,entries:model.entries,revision:model.revision};
 invoke('ftvSaveTeacher',[payload],result=>{
  dirty=false;model=result;originalId=String(result.teacher.teacher_id);
  loadBootstrap(originalId);status('已儲存 · 未發布');
 });
};
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
// No faculty data is loaded before successful OTP verification.
</script>
