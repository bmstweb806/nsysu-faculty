<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{font-family:Arial,'Noto Sans TC',sans-serif;color:#243241;line-height:1.55}
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;font-size:14px}
header{position:sticky;top:0;background:white;z-index:3;border-bottom:1px solid #d9e0e8;padding:11px 18px}
h1{font-size:18px;margin:0 0 7px;color:#164c71}h2{font-size:17px;margin:0 0 12px}
nav{display:flex;gap:6px;overflow:auto;padding:9px 0 2px}button,select,input,textarea{font:inherit}
button{cursor:pointer;border:1px solid #cbd7e0;background:white;color:#184f76;padding:8px 13px;border-radius:7px}
button:disabled{opacity:.55;cursor:wait}button.primary{background:#17618c;color:white;border-color:#17618c}
button.danger{color:#a83236;border-color:#dfb8b9}button.muted{color:#4a5665}
nav button{white-space:nowrap;padding:7px 11px}nav button.active{background:#17618c;color:white;border-color:#17618c}
main{padding:14px 18px 24px;max-width:1150px;margin:auto}
.panel{border:1px solid #d9e0e8;background:#fff;border-radius:9px;padding:16px;margin-bottom:14px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.controls select{min-width:270px;flex:1}
.badge{font-size:12px;background:#edf4f9;border-radius:20px;padding:4px 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 15px}
label.field{display:flex;flex-direction:column;gap:4px;color:#536274;font-weight:600;font-size:12px}
input[type=text],input[type=email],input[type=url],input[type=number],textarea,select{width:100%;border:1px solid #c6d2dc;border-radius:6px;padding:8px;background:white;color:#243241}
textarea{min-height:72px;resize:vertical}.wide{grid-column:1/-1}
.checks{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:8px 0}
.checks label{display:flex;align-items:center;gap:6px}
.card{border:1px solid #dce4eb;border-radius:8px;background:#fcfdff;padding:12px;margin:10px 0}
.card-head{display:flex;gap:7px;align-items:center;justify-content:space-between;margin-bottom:9px}
.card-head .actions{display:flex;gap:5px}.card-head button{padding:4px 8px}
.note{color:#697783;font-size:12px}.sticky-save{position:sticky;bottom:0;background:rgba(255,255,255,.98);padding:12px 18px;border-top:1px solid #d9e0e8;display:flex;align-items:center;gap:12px;justify-content:space-between}
#status{min-height:21px;color:#17618c}#status.error{color:#b31c2d}
section[hidden]{display:none}input:focus,textarea:focus{outline:2px solid #a0d3ed}
@media(max-width:760px){.grid{grid-template-columns:1fr}.controls select{min-width:100px}main{padding:10px}header{padding:10px}.wide{grid-column:auto}}
</style>
</head>
<body>
<header>
  <h1>NSYSU 教師資料管理 V3 · 中英文</h1>
  <div class="controls">
    <select id="teacherSelect" aria-label="選擇教師"><option>載入中...</option></select>
    <button id="reloadBtn">重新載入</button>
    <button id="newBtn">＋ 建立教師</button>
    <span class="badge" id="sheetLabel"></span>
  </div>
  <nav id="navigation" aria-label="管理分頁"></nav>
</header>
<main>
  <section id="basicPanel" class="panel">
    <h2>基本資料 / Faculty Profile</h2>
    <div id="basicFields" class="grid"></div>
    <div id="basicFlags" class="checks"></div>
    <p class="note">中英文欄位分開儲存；英文未完成時，可取消「顯示英文教師頁」。草稿不會被正式發布。</p>
  </section>
  <section id="entriesPanel" class="panel" hidden>
    <div class="controls" style="justify-content:space-between">
      <div><h2 id="entriesTitle">內容</h2><div id="entriesSubtitle" class="note"></div></div>
      <button id="addBtn">＋ 新增這個分頁的內容</button>
    </div>
    <div id="entries"></div>
  </section>
</main>
<div class="sticky-save">
  <span id="status" aria-live="polite">讀取資料中...</span>
  <button class="primary" id="saveBtn" disabled>儲存全部變更</button>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
let defs=[],teachers=[],categories=[],model=null,activeKey='basic',busy=false,dirty=false;
const profileFields=[
 ['teacher_id','教師 ID / Teacher ID','text',true],
 ['name_zh','中文姓名','text',true],['name_en','English Name','text'],
 ['title_zh','中文職稱','text'],['title_en','English Title','text'],
 ['unit_zh','中文系所','text'],['unit_en','English Unit','text'],
 ['office_zh','中文辦公室','text'],['office_en','English Office','text'],
 ['expertise_zh','中文研究專長','textarea'],['expertise_en','English Research Interests','textarea'],
 ['email','Email','email'],['profile_url','個人網址 / Profile URL','url'],
 ['photo_url','照片網址 / Photo URL','url'],['display_order','教師排序','number']
];
function setStatus(message,error=false){$('status').textContent=message;$('status').className=error?'error':'';}
function setBusy(on){busy=on;for(const id of ['newBtn','reloadBtn','saveBtn','teacherSelect'])$(id).disabled=on || (id==='saveBtn'&&!model);}
function call(name,args=[],ok){setBusy(true);setStatus('正在處理...');google.script.run
 .withFailureHandler(e=>{setBusy(false);setStatus(e.message||String(e),true);})
 .withSuccessHandler(r=>{setBusy(false);ok(r);})[name](...args);}
function markDirty(){dirty=true;setStatus('有尚未儲存的修改');}
function cellLabel(label,field,value,type='text',cb,required=false){
 const host=document.createElement('label');host.className='field';host.textContent=label;
 const inp=document.createElement(type==='textarea'?'textarea':'input');
 if(type!=='textarea')inp.type=type;inp.value=value==null?'':String(value);
 if(required)inp.required=true;
 inp.addEventListener('input',()=>{cb(inp.value);markDirty();});
 host.append(inp);return host;
}
function checkbox(text,checked,cb){
 const label=document.createElement('label'),inp=document.createElement('input');inp.type='checkbox';inp.checked=!!checked;
 inp.addEventListener('change',()=>{cb(inp.checked);markDirty();});label.append(inp,document.createTextNode(text));return label;
}
function button(text,handler,kind=''){const b=document.createElement('button');b.textContent=text;if(kind)b.className=kind;b.addEventListener('click',handler);return b;}
function renderTeacherSelect(){
 // 修改 ID 的過程中仍以原 ID 選中教師，直到儲存成功。
 const sel=$('teacherSelect'),chosen=model?.originalTeacherId||sel.value;sel.replaceChildren();
 for(const t of teachers){const o=document.createElement('option');o.value=t.id;o.textContent=`${t.id} · ${t.name} (${t.status})`;sel.append(o);}
 if(teachers.some(t=>t.id===chosen))sel.value=chosen;
 $('sheetLabel').textContent=model?model.teacher.teacher_sheet:'';
}
function renderNav(){
 const nav=$('navigation');nav.replaceChildren();
 const items=[{key:'basic',zh:'基本資料',en:'Profile'},...defs];
 for(const t of items){const b=button(t.zh,()=>{activeKey=t.key;render();});if(activeKey===t.key)b.classList.add('active');nav.append(b);}
}
function renderBasic(){
 const host=$('basicFields');host.replaceChildren();
 for(const [key,name,type,required] of profileFields){
  const f=cellLabel(name,key,model.teacher[key],type,v=>{model.teacher[key]=type==='number'?Number(v):v;},required);
  if(key==='teacher_id'){
   const input=f.querySelector('input');
   input.autocomplete='off';input.maxLength=40;input.pattern='[A-Za-z0-9_-]{2,40}';
   input.title='限 2–40 字元：英文字母、數字、底線、連字號';
   const tip=document.createElement('small');tip.className='note';
   tip.textContent='修改 ID 後會更新公開網址，不會移動或重新命名教師的 Google Sheets 工作表。';
   f.append(tip);
  }
  host.append(f);
 }
 const flag=$('basicFlags');flag.replaceChildren();
 const statusLabel=document.createElement('label');statusLabel.className='field';statusLabel.textContent='發布狀態 / Status';
 const select=document.createElement('select');
 for(const [val,label] of [['DRAFT','草稿 / Draft'],['PUBLISHED','公開 / Published']]){const o=document.createElement('option');o.value=val;o.textContent=label;select.append(o);}
 select.value=String(model.teacher.publish_status||'DRAFT');
 select.addEventListener('change',()=>{model.teacher.publish_status=select.value;markDirty();});
 statusLabel.append(select);flag.append(statusLabel);
 const catLabel=document.createElement('label');catLabel.className='field';
 catLabel.textContent='教師分類 / Faculty Category';
 const catSelect=document.createElement('select');
 for(const cat of categories){
   const opt=document.createElement('option');opt.value=cat.key;
   opt.textContent=cat.zh+' / '+cat.en;catSelect.append(opt);
 }
 catSelect.value=String(model.teacher.category_key||'full_time');
 catSelect.addEventListener('change',()=>{model.teacher.category_key=catSelect.value;markDirty();});
 catLabel.append(catSelect);flag.append(catLabel);
 flag.append(checkbox('顯示中文頁面',model.teacher.visible_zh,v=>model.teacher.visible_zh=v));
 flag.append(checkbox('顯示英文頁面',model.teacher.visible_en,v=>model.teacher.visible_en=v));
}
function entriesFor(key){return model.entries.filter(e=>String(e.section_key)===key)
  .sort((a,b)=>Number(a.sort_order)-Number(b.sort_order));}
function renderEntries(){
 const def=defs.find(d=>d.key===activeKey),host=$('entries');
 $('entriesTitle').textContent=def.zh+' / '+def.en;
 $('entriesSubtitle').textContent='Tab 的順序由系統鎖定；下方內容項目可以上下移動。';
 host.replaceChildren();const list=entriesFor(activeKey);
 if(!list.length){const p=document.createElement('p');p.className='note';p.textContent='尚無內容。可新增中文或英文資料。';host.append(p);}
 list.forEach((entry,i)=>{
  const box=document.createElement('article');box.className='card';
  const head=document.createElement('div');head.className='card-head';
  const num=document.createElement('strong');num.textContent='第 '+(i+1)+' 筆';head.append(num);
  const acts=document.createElement('div');acts.className='actions';
  acts.append(button('↑',()=>moveEntry(activeKey,i,-1)));acts.append(button('↓',()=>moveEntry(activeKey,i,1)));
  acts.append(button('刪除',()=>{if(!confirm('刪除此筆資料？儲存後生效。'))return;model.entries.splice(model.entries.indexOf(entry),1);reindex(activeKey);markDirty();renderEntries();},'danger'));
  head.append(acts);box.append(head);
  const grid=document.createElement('div');grid.className='grid';
  for(const [key,label,type] of [
    ['title_zh','項目標題（中文）','text'],['title_en','Entry title (English)','text'],
    ['content_zh','內容（中文）','textarea'],['content_en','Content (English)','textarea'],
    ['link_url','相關網址（兩語共用）','url']]){
   const el=cellLabel(label,key,entry[key],type,v=>entry[key]=v);
   if(key==='link_url')el.classList.add('wide');grid.append(el);
  }
  const typeLabel=document.createElement('label');typeLabel.className='field';typeLabel.textContent='呈現格式';
  const sel=document.createElement('select');for(const [value,label] of [['list_item','清單項目'],['text','段落']]){const o=document.createElement('option');o.value=value;o.textContent=label;sel.append(o);}
  sel.value=entry.entry_type||'list_item';sel.addEventListener('change',()=>{entry.entry_type=sel.value;markDirty();});typeLabel.append(sel);grid.append(typeLabel);
  box.append(grid);
  const checks=document.createElement('div');checks.className='checks';
  checks.append(checkbox('中文顯示',entry.visible_zh,v=>entry.visible_zh=v));
  checks.append(checkbox('英文顯示',entry.visible_en,v=>entry.visible_en=v));box.append(checks);
  host.append(box);
 });
}
function reindex(key){entriesFor(key).forEach((e,i)=>e.sort_order=(i+1)*10);}
function moveEntry(key,index,delta){
 const arr=entriesFor(key),dest=index+delta;if(dest<0||dest>=arr.length)return;
 const a=arr[index],b=arr[dest],tmp=a.sort_order;a.sort_order=b.sort_order;b.sort_order=tmp;
 markDirty();renderEntries();
}
function render(){renderTeacherSelect();renderNav();$('basicPanel').hidden=activeKey!=='basic';$('entriesPanel').hidden=activeKey==='basic';
 if(!model){$('basicPanel').hidden=false;$('entriesPanel').hidden=true;return;}
 if(activeKey==='basic')renderBasic();else renderEntries();$('saveBtn').disabled=busy;
}
function loadTeacher(id){if(!id){setStatus('目前沒有教師，請新增教師。');return;}
 call('ftvGetTeacher',[id],r=>{
  model=r;model.originalTeacherId=String(r.teacher.teacher_id);
  activeKey='basic';dirty=false;render();setStatus('已載入 '+r.teacher.name_zh);
 });
}
function bootstrap(choose){call('ftvGetBootstrap',[],r=>{defs=r.tabs;categories=r.categories||[];teachers=r.teachers;renderTeacherSelect();
 const id=choose||model?.teacher.teacher_id||teachers[0]?.id;
 if(id)loadTeacher(id);else{model=null;render();setStatus('請點選「建立教師」');}
});}
$('teacherSelect').addEventListener('change',e=>{
 const id=e.target.value;if(dirty&&!confirm('尚未儲存的修改將遺失，確定切換教師？')){renderTeacherSelect();return;}loadTeacher(id);
});
$('reloadBtn').addEventListener('click',()=>{
 if(dirty&&!confirm('確定捨棄未儲存的修改並重新讀取？'))return;
 bootstrap(model?.teacher.teacher_id);
});
$('newBtn').addEventListener('click',()=>{
 if(dirty&&!confirm('將捨棄未儲存修改，確定新增教師？'))return;
 const reply=prompt('請輸入新教師 ID（例如 BMST001）。留空會自動產生 T001、T002…','');
 if(reply===null)return;
 const customId=reply.trim();
 if(customId&&!/^[A-Za-z0-9_-]{2,40}$/.test(customId)){
  setStatus('教師 ID 只能使用英數字、底線、連字號，長度 2–40 字元。',true);return;
 }
 call('ftvCreateTeacher',[customId],r=>{model=null;bootstrap(r.id);});
});
$('addBtn').addEventListener('click',()=>{
 if(!model)return;
 const group=entriesFor(activeKey);model.entries.push({entry_id:'',section_key:activeKey,entry_type:'list_item',
  title_zh:'',title_en:'',content_zh:'',content_en:'',link_url:'',sort_order:(group.length?Math.max(...group.map(e=>Number(e.sort_order)||0)):0)+10,
  visible_zh:true,visible_en:false});markDirty();renderEntries();
});
$('saveBtn').addEventListener('click',()=>{
 if(!model)return;
 const oldId=String(model.originalTeacherId||'').trim();
 const newId=String(model.teacher.teacher_id||'').trim();
 if(!/^[A-Za-z0-9_-]{2,40}$/.test(newId)){
  setStatus('教師 ID 只能使用英數字、底線、連字號，長度 2–40 字元。',true);return;
 }
 if(oldId!==newId&&!confirm(`確定將教師 ID 從 ${oldId} 改為 ${newId}？\n原本使用舊 ID 的教師網址需要同步更新；教師專屬工作表及資料會保留。`))return;
 call('ftvSaveTeacher',[model],r=>{
  model=r;model.originalTeacherId=String(r.teacher.teacher_id);
  dirty=false;bootstrap(r.teacher.teacher_id);
 });
});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
bootstrap();
</script>
</body>
</html>
