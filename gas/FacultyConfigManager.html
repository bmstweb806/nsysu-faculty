<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--blue:#17618c;--ink:#273847;--line:#d9e3e9;--soft:#f4f7fa}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Arial,"Noto Sans TC",sans-serif;color:var(--ink)}
header{background:#123f5c;color:white;padding:15px 20px}
header h1{font-size:18px;margin:0}header p{font-size:12px;margin:3px 0 0;color:#d6e6ef}
nav{display:flex;gap:7px;flex-wrap:wrap;padding:10px 15px;background:var(--soft);border-bottom:1px solid var(--line)}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:var(--blue);background:#fff;border:1px solid #b5cbdb;border-radius:7px;padding:7px 11px}
button.primary,nav button.selected{color:white;background:var(--blue);border-color:var(--blue)}
button:disabled{opacity:.5}
#status{padding:8px 15px;color:var(--blue);min-height:38px;border-bottom:1px solid var(--line)}
#status.error{background:#fff3f3;color:#9f2435}
main{padding:17px;max-height:calc(100vh - 150px);overflow:auto}
h2{font-size:19px;margin:0 0 9px}p.hint{font-size:12px;color:#687b87}
.board{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;margin:10px 0 18px}
.config-card{width:228px;min-height:85px;padding:12px;background:var(--soft);border:1px solid var(--line);border-radius:9px}
.config-card strong{display:block;font-size:15px}.config-card small{display:block;color:#748693;margin:4px 0}
.config-card button{padding:4px 9px;margin-top:7px}
.panel{padding:15px;border:1px solid var(--line);border-radius:9px;background:white;max-width:850px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.field{display:flex;flex-direction:column;gap:4px;font-weight:600;color:#526778;font-size:12px}
input,select,textarea{width:100%;min-width:0;background:#fff;border-radius:6px;border:1px solid #b3c6d4;padding:8px;color:var(--ink)}
.check{display:inline-flex;align-items:center;gap:5px;font-size:13px;margin:8px 12px 8px 0}
.check input{width:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:7px 0}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{background:var(--soft)}
@media(max-width:650px){.grid{grid-template-columns:1fr}main{max-height:none}}
</style></head>
<body>
<header><h1>教師系統設定 / Faculty Settings</h1>
<p>設定以 Google Sheets 列順序為準，不使用顯示順序數字，也不建立每筆內容 ID。</p></header>
<nav>
<button data-view="category" class="selected">教師分類</button>
<button data-view="tab">個人頁 Tab</button>
<button data-view="field">Tab 自訂欄位</button>
<button data-view="teacher">教師分類指派</button>
<button data-view="publish">發布網站</button>
</nav>
<div id="status" role="status">準備載入…</div><main id="app"></main>
<script>
'use strict';
let config=null,view='category',editing=null,busy=false;
const $=id=>document.getElementById(id),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;'}[c]));
function status(msg,isError=false){$('status').textContent=msg;$('status').classList.toggle('error',isError)}
function run(name,args,cb){
 if(busy)return;busy=true;status('處理中…');
 google.script.run.withSuccessHandler(r=>{busy=false;status('已完成');if(cb)cb(r)})
 .withFailureHandler(e=>{busy=false;status(e?.message||String(e),true)})[name](...(args||[]));
}
function source(kind){return kind==='category'?config.categories:kind==='tab'?config.tabs:config.fields}
function label(k){return {category:'教師分類',tab:'個人頁 Tab',field:'自訂欄位'}[k]||k}
function field(id,title,value='',type='text',disabled=false){
 return '<label class="field">'+escapeHtml(title)+
 '<input id="'+id+'" type="'+type+'" value="'+escapeHtml(value)+'" '+(disabled?'readonly':'')+'></label>';
}
function options(items,getValue,getLabel){
 return items.map(r=>'<option value="'+escapeHtml(getValue(r))+'">'+escapeHtml(getLabel(r))+'</option>').join('');
}
function configEditor(){
 const old=editing===null?null:source(view)[editing],r=old||{};
 const section=view==='field'
 ?'<label class="field">所屬 Tab<select id="c-section" '+(old?'disabled':'')+'>'+
 options(config.tabs,r=>r.key,r=>r.zh+' / '+r.en)+'</select></label>':'';
 const type=view==='field'?
 '<label class="field">類型<select id="c-type">'+options(['text','textarea','url','number','date'],x=>x,x=>x)+'</select></label>':'';
 return '<div class="panel"><h2>'+(old?'修改':'新增')+label(view)+'</h2>'+
 '<div class="grid">'+section+field('c-key','代碼（建立後固定）',r.key||'','text',Boolean(old))+
 field('c-zh','中文名稱',r.zh||'')+field('c-en','English label',r.en||'')+type+'</div>'+
 '<div class="row"><label class="check"><input type="checkbox" id="c-active" '+(r.is_active!==false?'checked':'')+'>啟用</label>'+
 (view==='field'?'<label class="check"><input type="checkbox" id="c-required" '+(r.required?'checked':'')+'>必填</label>'+
 '<label class="check"><input type="checkbox" id="c-public" '+(r.show_public!==false?'checked':'')+'>公開顯示</label>':'')+
 '</div><div class="row"><button class="primary" id="save-config">儲存</button><button id="reset">新增另一項／取消</button></div>'+
 '<p class="hint">排列順序直接跟著 Google Sheets 的列順序。要調整排列，請在 Sheets 移動對應列，不用填排序數字。</p></div>';
}
function renderConfig(){
 const rows=source(view),title=label(view);
 $('app').innerHTML='<h2>'+title+'</h2>'+
 '<p class="hint">'+(view==='field'?'設定每個 Tab 可以編輯哪些中英文欄位；新增項目請回到教師編輯器按「＋新增」。':'名稱與排列直接依工作表設定。')+'</p>'+
 '<div class="board">'+rows.map((r,i)=>
 '<article class="config-card"><strong>'+escapeHtml(r.zh)+'</strong><small>'+escapeHtml(r.en)+'</small>'+
 '<small>'+escapeHtml(view==='field'?r.section_key+' / '+r.key:r.key)+' • '+(r.is_active?'啟用':'停用')+'</small>'+
 '<button data-edit="'+i+'">編輯</button></article>').join('')+'</div>'+
 configEditor();
 $('app').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=Number(b.dataset.edit);renderConfig()});
 const record=editing===null?null:rows[editing];
 if(record&&view==='field')$('c-section').value=record.section_key;
 if(record&&view==='field')$('c-type').value=record.type;
 $('reset').onclick=()=>{editing=null;renderConfig()};
 $('save-config').onclick=()=>{
  const data={key:$('c-key').value.trim(),zh:$('c-zh').value.trim(),en:$('c-en').value.trim(),
    is_active:$('c-active').checked};
  if(view==='field'){
   data.section_key=$('c-section').value;data.type=$('c-type').value;
   data.required=$('c-required').checked;data.show_public=$('c-public').checked;
  }
  run('fcfgUpsertConfig',[view,data],result=>{config=result;editing=null;renderConfig()});
 };
}
function renderTeachers(){
 $('app').innerHTML='<h2>教師分類指派</h2>'+
 '<p class="hint">教師順序與 Teachers 工作表相同。每位教師只需 teacher_id。</p>'+
 '<table><thead><tr><th>教師</th><th>ID</th><th>分類</th></tr></thead><tbody>'+
 config.teachers.map((t,i)=>'<tr><td>'+escapeHtml(t.name)+'</td><td>'+escapeHtml(t.id)+'</td><td>'+
 '<select data-teacher="'+i+'">'+options(config.categories.filter(c=>c.is_active),c=>c.key,c=>c.zh+' / '+c.en)+
 '</select></td></tr>').join('')+'</tbody></table>'+
 '<div class="row"><button id="apply" class="primary">儲存分類</button></div>';
 config.teachers.forEach((t,i)=>{$('app').querySelector('[data-teacher="'+i+'"]').value=t.category_key});
 $('apply').onclick=()=>{
  const changes=config.teachers.map((t,i)=>({
   id:t.id,category:$('app').querySelector('[data-teacher="'+i+'"]').value
  })).filter(x=>x.category&&x.category!==config.teachers.find(t=>t.id===x.id).category_key);
  let n=0;
  function next(){
   if(n>=changes.length){status('分類已儲存');return}
   const item=changes[n++];
   run('fcfgSetTeacherCategory',[item.id,item.category],result=>{config=result;next()});
  }next();
 };
}
function renderPublish(){
 $('app').innerHTML='<h2>發布資料</h2><p class="hint">修改 Sheets 或編輯老師資料後，必須重新發布 JSON 才會更新公開網站。預覽 JSON 也會公開在 GitHub。</p>'+
 '<div class="row"><button class="primary" id="live">正式發布</button><button id="preview">發布預覽</button></div>';
 $('live').onclick=()=>{if(confirm('確定發布目前已標記 PUBLISHED 的教師內容？'))
  run('fcfgPublishProduction',[],r=>status('已發布 '+r.teachers+' 位教師'))};
 $('preview').onclick=()=>{if(confirm('預覽 JSON 也會公開。確定繼續？'))
  run('fcfgPublishPreview',[],r=>status('已發布 '+r.teachers+' 位教師的預覽'))};
}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('selected',b.dataset.view===view));
 if(!config){$('app').textContent='載入中…';return;}
 if(['category','tab','field'].includes(view))renderConfig();
 else if(view==='teacher')renderTeachers();
 else renderPublish();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;editing=null;render()});
run('fcfgGetConfig',[],r=>{config=r;render()});
</script></body></html>
