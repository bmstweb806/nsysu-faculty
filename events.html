<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>學系重要活動日程｜國立中山大學</title>
<style>
:root{--blue:#174f72;--line:#dce5ed;--gray:#f5f8fb;--text:#273845}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font:16px/1.7 Arial,"Noto Sans TC",sans-serif}
main{max-width:1200px;margin:auto;padding:24px 18px 36px}
h1{font-size:clamp(23px,3vw,29px);color:var(--blue);margin:0 0 18px;padding-bottom:12px;border-bottom:3px solid var(--blue)}
.filters{display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:12px;margin-bottom:12px}
label{font-size:14px;font-weight:700;display:block;margin-bottom:4px}
input,select,button{font:inherit}input,select{width:100%;border:1px solid #b8c8d3;border-radius:5px;padding:8px 10px;background:white;color:inherit;min-height:44px}
input:focus,select:focus,button:focus-visible{outline:3px solid #8ac4e6;outline-offset:2px}
.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
#count{color:#526879;font-size:14px}button{border:1px solid #aec3d2;border-radius:5px;padding:7px 14px;color:var(--blue);background:#fff;cursor:pointer}
.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}th,td{border:1px solid var(--line);padding:11px 10px;vertical-align:top;text-align:left}
th{background:#e9f1f6;color:#173e58;white-space:nowrap;font-weight:700}tbody tr:nth-child(even){background:#f8fafc}
th:nth-child(1){min-width:148px}th:nth-child(2){min-width:105px}th:nth-child(3){min-width:105px}th:nth-child(4){min-width:72px}
th:nth-child(5){min-width:255px}th:nth-child(6){min-width:135px}th:nth-child(7){min-width:195px}
a{color:#12608c;overflow-wrap:anywhere}.empty{padding:26px;text-align:center;color:#64798a}.subtle{font-size:12px;color:#728390}
@media(max-width:760px){main{padding:18px 12px}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}
.table-wrap{overflow:visible}table,tbody,tr,td{display:block;width:100%}thead{display:none}tbody{display:grid;gap:12px}tr{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:7px;padding:12px;background:#fff!important}
td{border:0;padding:5px 0;display:grid;grid-template-columns:85px 1fr;gap:12px;overflow-wrap:anywhere}td::before{content:attr(data-label);color:#47647a;font-weight:700}}
</style>
</head>
<body>
<main><h1>學系重要活動日程</h1>
<div class="filters">
<div class="search"><label for="q">搜尋活動</label><input id="q" type="search" placeholder="活動、地點、備註…"></div>
<div><label for="audience">對象</label><select id="audience"><option value="">全部對象</option></select></div>
<div><label for="category">類別</label><select id="category"><option value="">全部類別</option></select></div>
<div><label for="year">年份</label><select id="year"><option value="">全部年份</option></select></div>
</div>
<div class="tools"><span id="count" role="status" aria-live="polite">正在讀取活動資料…</span><button id="reset" type="button">清除篩選</button></div>
<div class="table-wrap"><table aria-label="重要活動日程"><thead><tr><th scope="col">活動日期</th><th scope="col">活動時間</th><th scope="col">對象</th><th scope="col">類別</th><th scope="col">活動項目</th><th scope="col">地點</th><th scope="col">備註</th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="subtle">活動資訊如有變動，以主辦單位最新公告為準。</p></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const fields=[['date','活動日期'],['time','活動時間'],['audience','對象'],['category','類別'],['title','活動項目'],['location','地點'],['notes','備註']];
let events=[];
const dateText=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return s||'';const d=new Date(s+'T12:00:00+08:00');return s.replace(/-/g,' / ')+' ('+'日一二三四五六'[d.getDay()]+')'};
const sortEvents=(a,b)=>String(a.date).localeCompare(String(b.date))||(Number(a.sort_order)||0)-(Number(b.sort_order)||0)||String(a.id).localeCompare(String(b.id));
function makeOptions(id,values){for(const value of [...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'))){const el=document.createElement('option');el.value=value;el.textContent=value;$(id).append(el)}}
function render(){
 const term=$('q').value.trim().toLocaleLowerCase();
 const a=$('audience').value,c=$('category').value,y=$('year').value;
 const list=events.filter(e=>(!a||e.audience===a)&&(!c||e.category===c)&&(!y||String(e.date).startsWith(y))&&(!term||fields.some(([key])=>String(e[key]||'').toLocaleLowerCase().includes(term))));
 $('count').textContent='共 '+list.length+' 筆活動（總計 '+events.length+' 筆）';
 const tbody=$('rows');tbody.replaceChildren();
 if(!list.length){const row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=7;cell.className='empty';cell.textContent='沒有符合篩選條件的活動';row.append(cell);tbody.append(row);syncHeight();return}
 for(const event of list){const tr=document.createElement('tr');for(const [key,label] of fields){const td=document.createElement('td');td.setAttribute('data-label',label);td.textContent=key==='date'?dateText(event.date):String(event[key]||'');if(key==='title'&&/^https:\/\//.test(event.url||'')){const link=document.createElement('a');link.href=event.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=event.title||'查看活動';td.replaceChildren(link)}tr.append(td)}tbody.append(tr)}
 syncHeight();
}
function syncHeight(){requestAnimationFrame(()=>{const height=Math.ceil(document.documentElement.scrollHeight+12);window.parent.postMessage({type:'NSYSU_EVENTS_HEIGHT',height},'*')})}
for(const id of ['q','audience','category','year'])$(id).addEventListener(id==='q'?'input':'change',render);
$('reset').addEventListener('click',()=>{for(const id of ['q','audience','category','year'])$(id).value='';render()});
async function load(){
 try{const response=await fetch('./data/events.json',{cache:'no-cache'});if(!response.ok)throw new Error('HTTP '+response.status);
 const result=await response.json();if(!Array.isArray(result.events))throw new Error('JSON 格式不符');
 events=result.events.filter(e=>e&&e.date&&e.title).sort(sortEvents);
 makeOptions('audience',events.map(x=>x.audience));makeOptions('category',events.map(x=>x.category));makeOptions('year',events.map(x=>String(x.date).slice(0,4)));render()
 }catch(err){$('count').textContent='資料載入失敗：'+err.message;$('rows').replaceChildren();syncHeight()}
}
window.addEventListener('resize',syncHeight);if('ResizeObserver' in window)new ResizeObserver(syncHeight).observe(document.body);
load();
</script></body></html>
