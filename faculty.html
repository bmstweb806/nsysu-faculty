
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>教師學術經歷</title>
  
  <style>
    * { box-sizing: border-box; }
  
    body {
      margin: 0;
      background: #fff;
      color: #30343b;
      font-family: Arial, "Noto Sans TC", sans-serif;
      font-size: 16px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }
  
    #app {
      max-width: 980px;
      margin: 0 auto;
      padding: 22px 24px 28px;
    }
  
    .teacher-profile {
      background: #f6f8fb;
      border-left: 4px solid #17618c;
      padding: 22px 26px;
      margin-bottom: 32px;
      border-radius: 0 8px 8px 0;
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }
  
    .teacher-info { flex: 1; min-width: 0; }
  
    h1 {
      margin: 0 0 2px;
      font-size: 28px;
      line-height: 1.4;
      color: #163f5c;
    }
  
    .english-name {
      color: #697583;
      font-size: 15px;
      margin: 0 0 12px;
    }
  
    .teacher-title {
      font-weight: 600;
      margin: 8px 0 2px;
    }
  
    .teacher-unit {
      color: #596574;
      margin: 0 0 8px;
    }
  
    .contact { font-size: 14px; margin: 3px 0; }
  
    .teacher-photo {
      width: 120px;
      height: 150px;
      object-fit: cover;
      border-radius: 6px;
    }
  
    .faculty-section { margin-bottom: 30px; }
  
    .faculty-section h2 {
      font-size: 20px;
      color: #17618c;
      border-bottom: 1px solid #d7dfe7;
      padding: 0 0 9px 12px;
      margin: 0 0 16px;
      position: relative;
    }
  
    .faculty-section h2::before {
      content: "";
      position: absolute;
      left: 0;
      top: 7px;
      width: 4px;
      height: 23px;
      background: #17618c;
      border-radius: 4px;
    }
  
    .entry-list { margin: 0; padding-left: 26px; }
    .entry-list li { margin: 5px 0; }
    .entry { margin: 0 0 15px; }
    .entry h3 { font-size: 16px; margin: 0 0 3px; }
    .entry p { margin: 0; white-space: pre-line; }
  
    a { color: #17618c; }
    .teacher-row {
      display: block;
      border-bottom: 1px solid #e1e5ea;
      padding: 12px 0;
      text-decoration: none;
    }
    .teacher-row:hover { text-decoration: underline; }
    .muted { color: #687583; }
    .notice { padding: 16px; background: #f6f8fb; }
  
    @media (max-width: 600px) {
      #app { padding: 16px 14px 20px; }
      h1 { font-size: 24px; }
      .teacher-profile {
        padding: 16px;
        gap: 12px;
      }
      .teacher-photo {
        width: 84px;
        height: 108px;
      }
      .faculty-section h2 { font-size: 18px; }
    }
  </style>

  

  <script>
  (function () {
    function initHeightSync() {
      const app = document.getElementById('app');
      if (!app) return;
  
      let lastHeight = 0;
      let pending = false;
  
      function sendHeight() {
        pending = false;
  
        // 計算實際內容高度，不使用整個視窗高度
        const blocks = [...document.body.children]
          .filter(el => el.tagName !== 'SCRIPT');
  
        const bottom = blocks.reduce((max, el) => {
          return Math.max(
            max,
            el.getBoundingClientRect().bottom + window.scrollY
          );
        }, 0);
  
        const height = Math.ceil(bottom + 12);
  
        if (height < 100 || height === lastHeight) return;
        lastHeight = height;
  
        window.parent.postMessage({
          type: 'NSYSU_FACULTY_HEIGHT',
          height: height
        }, '*');
      }
  
      function scheduleHeight() {
        if (pending) return;
        pending = true;
        requestAnimationFrame(sendHeight);
      }
  
      // 持續觀察教師內容的尺寸變化
      const observer = new ResizeObserver(scheduleHeight);
      observer.observe(document.body);
      observer.observe(app);
  
      window.addEventListener('load', scheduleHeight);
      window.addEventListener('resize', scheduleHeight);
  
      scheduleHeight();
    }
  
    // 等待 HTML 載入完成才啟動
    if (document.readyState === 'loading') {
      document.addEventListener(
        'DOMContentLoaded',
        initHeightSync,
        { once: true }
      );
    } else {
      initHeightSync();
    }
  })();
  </script>


</head>
<body>
  <main id="app">
    <p>正在載入教師資料...</p>
  </main>

  <script>
    const app = document.getElementById('app');

    function make(tag, content) {
      const el = document.createElement(tag);
      el.textContent = String(content ?? '');
      return el;
    }

    async function loadFaculty() {
      try {
        const response = await fetch('./data/faculty.json');
        if (!response.ok) {
          throw new Error('尚未發布正式教師資料');
        }

        const data = await response.json();
        const teachers = data.teachers || [];
        const id = new URLSearchParams(
          location.search
        ).get('teacher');

        app.replaceChildren();

        if (!id) {
          app.append(make('h1', '教師列表'));

          teachers.forEach(t => {
            const p = document.createElement('p');
            const a = make('a', t.name_zh);
            a.href = '?teacher=' + encodeURIComponent(t.id);
            p.append(a, make('span', ' — ' + (t.title || '')));
            app.append(p);
          });

          if (!teachers.length) {
            app.append(make('p', '目前沒有已發布的教師'));
          }
          return;
        }

        const teacher = teachers.find(t => t.id === id);

        if (!teacher) {
          app.append(make('p', '找不到指定的教師資料'));
          return;
        }

        app.append(make('h1', teacher.name_zh));

        if (teacher.name_en) {
          const en = make('p', teacher.name_en);
          en.className = 'muted';
          app.append(en);
        }

        app.append(make('p',
          [teacher.title, teacher.unit]
            .filter(Boolean).join('｜')
        ));

        if (teacher.email) {
          app.append(make('p', 'Email：' + teacher.email));
        }

        if (teacher.office) {
          app.append(make('p', '辦公室：' + teacher.office));
        }

        (teacher.sections || []).forEach(section => {
          const box = document.createElement('section');
          box.append(make('h2', section.title));

          (section.entries || []).forEach(entry => {
            const item = document.createElement('div');

            if (entry.title) {
              const strong = make('strong', entry.title);
              item.append(strong);
            }

            if (entry.content) {
              item.append(make('p', entry.content));
            }

            if (entry.url) {
              try {
                const url = new URL(entry.url);
                if (['https:', 'http:'].includes(url.protocol)) {
                  const link = make('a', '查看相關連結');
                  link.href = url.href;
                  link.target = '_blank';
                  link.rel = 'noopener noreferrer';
                  item.append(link);
                }
              } catch (_) {}
            }

            box.append(item);
          });

          app.append(box);
        });

      } catch (error) {
        app.replaceChildren();
        app.append(make('h1', '教師資料尚未發布'));
        app.append(make('p', error.message));
      }
    }

    loadFaculty();
  </script>
</body>
</html>
